<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nosso Mundinho</title>
__PEERJS__
__THREE__
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#5b4654; --bg2:#33272f; --ink:#fff7f2; --muted:#dcc8d1;
  --correct:#3aa394; --present:#d9a54a; --absent:#2b2226;
  --future:#5a4552; --curBorder:#9b8292; --key:#8a7380; --accent:#ff7a93;
  --p0:#4a9bff; --p1:#ffc23d;
  --tile:min(14vw, 6.1dvh, 60px);
  --keyh:min(54px, 6.4dvh);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;margin:0;height:100%;color:var(--ink);font-family:'Fredoka',ui-rounded,system-ui,-apple-system,sans-serif;overscroll-behavior:none;overflow:hidden}
body{background:radial-gradient(130% 80% at 50% 0%,#735a69 0%,var(--bg1) 38%,var(--bg2) 100%) fixed;background-color:var(--bg2)}
button{font-family:inherit;color:inherit}
#app{height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;position:relative}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;animation:fadeIn .28s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 2px;min-height:50px;gap:8px}
.top h1{font-size:1.12rem;font-weight:600;margin:0;letter-spacing:.3px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;flex-shrink:0;border-radius:50%;border:0;background:rgba(255,255,255,.12);font-size:1.15rem;font-weight:700;display:grid;place-items:center;cursor:pointer}
.ibtn:active{background:rgba(255,255,255,.22)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px 18px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 16px;border-radius:16px;border:0;
  font:600 1.08rem 'Fredoka',ui-rounded,system-ui,sans-serif;background:var(--correct);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.28);cursor:pointer;text-decoration:none;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.alt{background:#7d6573}.btn.pink{background:var(--accent)}.btn.gold{background:var(--present)}.btn.wa{background:#25a35a}.btn.blue{background:#4a7bd6}
.btn.small{padding:10px 14px;font-size:.98rem;border-radius:12px;width:auto}
.btn:disabled{opacity:.5}
.stack{display:flex;flex-direction:column;gap:12px}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.92rem;cursor:pointer;padding:8px}

/* ---------- bonequinhos ---------- */
.avatar{position:relative;display:flex;flex-direction:column;align-items:center}
.avatar .fig{height:100%;aspect-ratio:100/150;transform-origin:50% 100%}
.avatar svg{width:100%;height:100%;overflow:visible;display:block}
.m-idle .fig{animation:bob 2.6s ease-in-out infinite}
.m-think .fig{animation:sway 2.2s ease-in-out infinite}
.m-happy .fig{animation:jump .55s ease-in-out infinite}
.m-sad .fig{animation:droop 1.6s ease-in-out infinite}
.m-sign .fig,.m-wave .fig{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}35%{transform:translateY(-16%) scale(.97,1.03)}70%{transform:translateY(0) scale(1.05,.95)}}
@keyframes droop{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(2px) scale(1.01,.98)}}
.eyes{animation:blink 4.2s infinite;transform-origin:50px 48px;transform-box:view-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.waveArm{animation:wave .7s ease-in-out infinite alternate;transform-origin:69px 82px;transform-box:view-box}
@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.shadow{width:60%;height:8px;border-radius:50%;background:rgba(0,0,0,.25);margin-top:-6px}
.avatar.active .shadow{background:rgba(255,214,120,.55);box-shadow:0 0 14px 4px rgba(255,214,120,.45)}
.bubble{position:absolute;bottom:92%;left:50%;transform:translateX(-50%) scale(.6);background:#fff;color:#3a2a33;font-weight:600;font-size:.86rem;
  padding:6px 10px;border-radius:14px;white-space:nowrap;opacity:0;pointer-events:none;transition:all .22s cubic-bezier(.3,1.6,.6,1);z-index:30;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.bubble:after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}
.bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
.avatar.left .bubble{left:62%}.avatar.right .bubble{left:38%}

/* ---------- parquinho ---------- */
.statusBar{display:flex;justify-content:center;padding:0 12px 6px}
.pill{background:rgba(0,0,0,.25);border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#9aa}
.dot.on{background:#4ade80;box-shadow:0 0 8px #4ade80}
.banner{margin:0 12px 8px;background:#fff7f2;color:#3a2a33;border-radius:14px;padding:8px 8px 8px 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:.92rem;animation:fadeIn .3s}
.banner span{flex:1}
.banner .btn{width:auto;padding:8px 12px;font-size:.9rem;border-radius:10px;box-shadow:none}
.banner .x{background:none;border:0;font-size:1.1rem;color:#9b8792;padding:4px 6px;cursor:pointer}
.scene{flex:1;position:relative;overflow:hidden;border-radius:24px;margin:0 10px;min-height:0;
  background:linear-gradient(180deg,#ffb8a2 0%,#ffd8a8 22%,#ffe9c2 33%,#9fd77a 33.2%,#86c962 60%,#6fb552 100%);touch-action:none;cursor:pointer;isolation:isolate}
.scene .deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:55%;height:160%;left:15%;top:-70%}.cloud:after{width:40%;height:130%;left:50%;top:-45%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.station{position:absolute;transform:translate(-50%,-100%);width:30%;cursor:pointer;z-index:2;transition:transform .15s}
.station:active{transform:translate(-50%,-100%) scale(.96)}
.station svg{width:100%;display:block;overflow:visible;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.station .who{position:absolute;left:50%;top:-14px;transform:translateX(-50%);display:flex;gap:2px}
.char{position:absolute;transform:translate(-50%,-100%);z-index:5;pointer-events:auto}
.char.left .fig svg{transform:scaleX(-1)}
.char .avatar{height:var(--ch,110px)}
.char.walking .fig{animation:walk .32s ease-in-out infinite !important}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6%) rotate(3deg)}}
.char .tag{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:2px;font-size:.78rem;font-weight:600;background:rgba(40,25,35,.55);padding:1px 8px;border-radius:999px;white-space:nowrap;color:#fff}
.char.ctrl .tag{background:#ff7a93}
.char .bubble{bottom:auto;top:-30px}
.marker{position:absolute;width:26px;height:12px;border-radius:50%;border:3px solid rgba(255,255,255,.85);transform:translate(-50%,-50%);pointer-events:none;animation:ping .6s ease-out forwards;z-index:1}
@keyframes ping{from{opacity:1;transform:translate(-50%,-50%) scale(.4)}to{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
.enterBtn{position:absolute;transform:translate(-50%,0);z-index:20;padding:8px 14px;border-radius:999px;border:0;background:#ff7a93;color:#fff;font:600 .95rem Fredoka,system-ui;box-shadow:0 3px 0 rgba(0,0,0,.25);animation:pop .3s;cursor:pointer;white-space:nowrap}
@keyframes pop{from{transform:translate(-50%,0) scale(.3);opacity:0}70%{transform:translate(-50%,0) scale(1.1)}to{transform:translate(-50%,0);opacity:1}}
.fly{position:absolute;font-size:1.4rem;pointer-events:none;animation:fly 1.4s ease-out forwards;z-index:40}
@keyframes fly{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),-140px) scale(1.3);opacity:0}}
.emotes{display:flex;gap:6px;padding:8px 10px 10px;align-items:center}
.emo{flex:1;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.13);font-size:1.35rem;cursor:pointer;padding:0}
.emo:active{background:rgba(255,255,255,.25);transform:scale(.94)}
.ctrlBar{display:flex;gap:6px;justify-content:center;padding:0 10px;font-size:.85rem;color:var(--muted);align-items:center}
.ctrlBar button{border:2px solid transparent;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 12px;font-weight:600;cursor:pointer}
.ctrlBar button.on{border-color:#ff7a93;background:rgba(255,122,147,.25);color:#fff}

/* ---------- termo ---------- */
.stage{display:flex;justify-content:space-between;align-items:flex-end;padding:0 10px;margin-top:22px;height:min(190px,19dvh);position:relative;flex-shrink:0}
.stage .avatar{height:100%}
.turn{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);text-align:center;font-size:.9rem;color:var(--muted);line-height:1.25}
.turn b{display:block;color:#fff;font-size:1.05rem}
.mini{display:grid;grid-template-columns:repeat(5,9px);gap:2px;justify-content:center;margin-top:4px}
.mini i{width:9px;height:9px;border-radius:2px;background:rgba(255,255,255,.12)}
.mini i.c{background:var(--correct)}.mini i.p{background:var(--present)}.mini i.a{background:#221a1e}
.boardWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.board{display:grid;grid-template-rows:repeat(6,var(--tile));gap:6px}
.brow{display:grid;grid-template-columns:repeat(5,var(--tile));gap:6px}
.tile{width:var(--tile);height:var(--tile);border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:calc(var(--tile)*.56);text-transform:uppercase;line-height:1}
.brow.future .tile{background:var(--future)}
.brow.current .tile{border:4px solid var(--curBorder);cursor:pointer}
.brow.current .tile.cursor{border-bottom-width:10px}
.brow.current .tile.filled{animation:tap .12s}
@keyframes tap{50%{transform:scale(1.08)}}
.tile.correct{background:var(--correct)}.tile.present{background:var(--present)}.tile.absent{background:var(--absent)}
.tile.flip{animation:flip .5s ease both}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.tile.win{animation:hop .5s ease both}
@keyframes hop{40%{transform:translateY(-34%)}70%{transform:translateY(6%)}}
.brow.shake,.shakeIt{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.kb{padding:6px 5px 8px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.kr{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:46px;height:var(--keyh);border:0;border-radius:8px;background:var(--key);font-weight:600;font-size:1.2rem;text-transform:uppercase;display:grid;place-items:center;cursor:pointer;padding:0}
.key:active{filter:brightness(1.25)}
.key.wide{max-width:none;flex:1.9;font-size:.92rem;letter-spacing:.5px}
.key.bk{max-width:none;flex:1.25}
.key.correct{background:var(--correct)}.key.present{background:var(--present)}.key.absent{background:#3a2f34;color:#8f7f87}
.pickBox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0;padding:0 16px}
.pickBox .avatar{height:min(150px,19dvh)}
.ptitle{font-size:1.22rem;font-weight:600;text-align:center;margin:0}
.psub{color:var(--muted);text-align:center;margin:0;font-size:.98rem}
.pickTiles .brow.current .tile{border-color:#c7aebd}
.tools{display:flex;gap:8px;justify-content:center}
.tools .btn{white-space:nowrap;padding:10px 12px;font-size:.95rem}
.endCard{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:#fff7f2;color:#3a2a33;border-radius:22px;padding:16px 16px 14px;
  box-shadow:0 10px 40px rgba(0,0,0,.45);animation:up .35s cubic-bezier(.3,1.4,.6,1);z-index:50}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.endCard h2{margin:0 0 4px;text-align:center;font-size:1.45rem}
.endCard p{margin:0 0 12px;text-align:center;color:#6f5a66}
.word{display:flex;gap:5px;justify-content:center;margin:6px 0 12px}
.word span{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:1.3rem;text-transform:uppercase;color:#fff;background:var(--correct)}
.resStage{display:flex;justify-content:center;align-items:flex-end;gap:18px;height:min(190px,24dvh);margin:22px 0 10px}
.resStage .avatar{height:100%}
.cards{display:flex;gap:10px;margin-bottom:14px}
.pcard{flex:1;background:rgba(0,0,0,.2);border-radius:16px;padding:12px;text-align:center}
.pcard .who{font-weight:600}
.pcard .tries{font-size:1.6rem;font-weight:700;margin:2px 0}
.pcard .grid{font-size:.8rem;line-height:1.05;letter-spacing:-1px;margin:6px 0}
.pcard .w{font-size:.85rem;color:var(--muted)}
.big{font-size:1.55rem;font-weight:700;text-align:center;margin:4px 0 2px}
.mid{text-align:center;color:var(--muted);margin:0 0 14px}
.preview{height:min(190px,24dvh);display:flex;justify-content:center;margin:34px 0 8px}
.preview .avatar{height:100%}
label.lb{display:block;font-weight:600;margin:14px 0 8px;font-size:.98rem;color:#ffe3ea}
input.txt{width:100%;font:600 18px 'Fredoka',ui-rounded,system-ui,sans-serif;padding:12px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.18);background:rgba(0,0,0,.2);color:#fff;outline:none;user-select:text;-webkit-user-select:text}
input.txt:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid transparent;border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.12);font-weight:600;cursor:pointer;font-size:.95rem}
.chip.dot{width:38px;height:38px;padding:0}
.chip.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.codeTiles{display:flex;gap:6px;justify-content:center;margin:10px 0}
.codeTiles span{width:52px;height:56px;border-radius:12px;background:var(--present);display:grid;place-items:center;font-size:1.9rem;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.msgBox{background:rgba(0,0,0,.22);border-radius:14px;padding:12px 14px;white-space:pre-wrap;font-size:.95rem;line-height:1.35;margin-bottom:14px;user-select:text;-webkit-user-select:text}
textarea.copyFallback{width:100%;height:110px;border-radius:12px;padding:10px;font:500 15px 'Fredoka',system-ui;background:#fff;color:#222;border:0;margin-top:8px;user-select:text;-webkit-user-select:text}

/* ---------- bingo ---------- */
.caller{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 12px 10px;flex-shrink:0}
.ballBig{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff 0 18%,var(--bc,#ff7a93) 19%);box-shadow:inset -6px -8px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.3);flex-shrink:0}
.ballBig .in{width:54px;height:54px;border-radius:50%;background:#fff;color:#3a2a33;display:grid;place-items:center;line-height:1;text-align:center;font-weight:700}
.ballBig .in small{display:block;font-size:.8rem;color:var(--bc)}
.ballBig .in b{font-size:1.45rem}
.ballBig.pop{animation:ballpop .45s cubic-bezier(.3,1.6,.6,1)}
@keyframes ballpop{from{transform:scale(.3) rotate(-90deg)}to{transform:none}}
.hist{display:flex;flex-wrap:wrap;gap:5px;max-width:190px}
.hist span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:#fff;opacity:.9}
.callerInfo{font-size:.85rem;color:var(--muted);text-align:center}
.cardsArea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0;padding:0 10px 10px;overflow:auto}
.bcards{display:flex;gap:10px;justify-content:center;width:100%}
.bcard{background:#fff7f2;border-radius:16px;padding:8px;color:#3a2a33;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.bcard .hd{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px;font-weight:700}
.bcard .hd .nm{font-size:.95rem;display:flex;align-items:center;gap:6px}
.bgrid{display:grid;grid-template-columns:repeat(5,var(--bc-s));gap:4px}
.bgrid .h{height:calc(var(--bc-s)*.7);display:grid;place-items:center;font-weight:700;color:#fff;border-radius:6px;font-size:calc(var(--bc-s)*.42)}
.bcell{width:var(--bc-s);height:var(--bc-s);border-radius:8px;background:#efe3e8;display:grid;place-items:center;font-weight:700;font-size:calc(var(--bc-s)*.4);cursor:pointer;position:relative}
.bcell.free{background:#ffd6de;font-size:calc(var(--bc-s)*.45)}
.bcell.mk{color:#fff}
.bcell.mk:after{content:"";position:absolute;inset:12%;border-radius:50%;border:3px solid rgba(255,255,255,.75)}
.bcell.win{animation:hop .5s ease both}
.headDot{width:26px;height:26px;border-radius:50%;overflow:hidden;background:rgba(0,0,0,.08);flex-shrink:0}
.headDot svg{width:100%;height:auto;transform:scale(2.1) translateY(14%)}
.bingoBtn{width:100%;margin-top:8px;padding:10px;border-radius:12px;border:0;font:700 1.1rem Fredoka,system-ui;color:#fff;background:#ff7a93;box-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer;letter-spacing:1px}
.bingoBtn:active{transform:translateY(2px);box-shadow:none}
.waitNote{font-size:.85rem;color:var(--muted);text-align:center}

/* ---------- caça-palavras ---------- */
.cacaHead{display:flex;align-items:flex-end;justify-content:space-between;padding:0 14px;height:min(130px,14dvh);margin-top:16px;flex-shrink:0;position:relative}
.cacaHead .avatar{height:100%}
.cacaHead .sc{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);text-align:center;font-weight:700;font-size:1.5rem}
.cacaHead .sc small{display:block;font-size:.85rem;color:var(--muted);font-weight:600}
.words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px 12px;flex-shrink:0}
.words span{padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:600;font-size:.88rem;letter-spacing:.5px}
.words span.got{text-decoration:line-through;color:#3a2a33}
.gridWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 10px 12px}
.cgrid{position:relative;display:grid;grid-template-columns:repeat(10,var(--cs));background:#fff7f2;border-radius:16px;padding:6px;box-shadow:0 5px 0 rgba(0,0,0,.25);touch-action:none}
.cgrid .cl{width:var(--cs);height:var(--cs);display:grid;place-items:center;font-weight:700;color:#3a2a33;font-size:calc(var(--cs)*.52);position:relative;z-index:2}
.cgrid svg{position:absolute;left:6px;top:6px;pointer-events:none;z-index:1}
.turnTag{font-size:.9rem;color:var(--muted);text-align:center;flex-shrink:0}

/* ---------- modal / toast ---------- */
.modalBg{position:fixed;inset:0;background:rgba(20,12,18,.6);display:flex;align-items:flex-end;justify-content:center;z-index:80;padding:14px;animation:fadeIn .2s}
.modal{background:#fff7f2;color:#3a2a33;border-radius:24px;padding:20px 18px calc(18px + env(safe-area-inset-bottom));max-width:480px;width:100%;max-height:88dvh;overflow:auto}
.modal h2{margin:0 0 10px;font-size:1.35rem}
.modal p{margin:8px 0;line-height:1.4;color:#5a4652}
.modal .btn.alt{background:#a28d98}
.ex{display:flex;gap:4px;margin:10px 0 2px}
.ex span{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;font-weight:700;color:#fff;background:#b7a6b0;text-transform:uppercase}
.whoPick{display:flex;justify-content:center;gap:16px;height:150px;margin:6px 0 10px}
.whoPick .opt{height:100%;display:flex;flex-direction:column;align-items:center;border-radius:18px;padding:6px 8px 4px;border:3px solid transparent;cursor:pointer;background:#f1e6eb}
.whoPick .opt.on{border-color:#ff7a93;background:#ffe3ea}
.whoPick .avatar{flex:1;min-height:0}
.whoPick .nm{font-weight:600;font-size:.95rem}

<body>
<div id="app"></div>
<script>
/* =================== DICIONÁRIO =================== */
const VALID = "__VALID__".split(" ");
const ACC = __ACC__;
const ANSWERS = "__ANSWERS__".split(" ");
const VSET = new Set(VALID);
const disp = k => ACC[k] || k;
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();

/* =================== ESTADO LOCAL =================== */
const KEY = "parquinho-v1";
const DEF = {players:[
  {name:"Alvaro",skin:0,hair:5,hairColor:6,shirt:6,build:1,acc:2},
  {name:"Leticia",skin:0,hair:1,hairColor:0,shirt:8,build:2,acc:1}],
  wins:{termo:[0,0],bingo:[0,0],caca:[0,0]}, me:0, picked:false, used:[], seenRes:[], seenInv:[],
  pos:[{x:.36,y:.74},{x:.64,y:.74}], rounds:0};
let S;
try{ const saved=JSON.parse(localStorage.getItem(KEY)||"null")||{}; S=Object.assign(JSON.parse(JSON.stringify(DEF)), saved); S.wins=Object.assign(JSON.parse(JSON.stringify(DEF.wins)),saved.wins||{}); }
catch(e){ S=JSON.parse(JSON.stringify(DEF)); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const nm = i => esc(S.players[i].name || (i? "Jogador 2":"Jogador 1"));
const nmRaw = i => S.players[i].name || (i? "Jogador 2":"Jogador 1");
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const pick = a => a[Math.floor(Math.random()*a.length)];
const other = () => 1 - S.me;
function addWin(game, i){ if(i<0) return; S.wins[game]=S.wins[game]||[0,0]; S.wins[game][i]++; save(); }

/* RNG com semente (pros dois celulares gerarem o mesmo jogo) */
function rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rint=(r,n)=>Math.floor(r()*n);
function shuffle(arr,r){ for(let i=arr.length-1;i>0;i--){ const j=rint(r,i+1); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
const newSeed=()=>1+Math.floor(Math.random()*2147483000);

/* =================== PERSONAGENS =================== */
const SKINS=["#fbe0cc","#f1c7a5","#d39a6a","#8d5a3b"];
const HAIRC=["#1f1411","#5a3424","#c27a35","#e6c36a","#93324a","#2c3f73","#3b2519"];
const SHIRTS=["#4a7bd6","#e8607f","#3aa394","#f0a23b","#8a63d2","#f4efe9","#1f1d23","#e2463b","#f9c93c"];
const HAIRS=["Curto","Longo liso","Cacheado","Coque","Careca","Franja"];
const BUILDS=["Camiseta","Regata (fortão)","Vestido"];
const ACCS=["Nada","Girassol 🌻","Correntinha"];
const INK="#2a1f22";
function shade(h,a){ const n=parseInt(h.slice(1),16); const f=c=>Math.max(0,Math.min(255,c+a)); return "#"+[f(n>>16),f((n>>8)&255),f(n&255)].map(x=>x.toString(16).padStart(2,"0")).join(""); }

/* poses: [cotovelo, mão] de cada braço (olhando de frente; o personagem vira com espelhamento) */
function armPose(mood, sxL, sxR, sy){
  const P={
    idle:  [[sxL-3,sy+24],[sxL-4,sy+46], [sxR+3,sy+24],[sxR+4,sy+46]],
    happy: [[sxL-11,sy-8],[sxL-13,sy-28], [sxR+11,sy-8],[sxR+13,sy-28]],
    wave:  [[sxL-3,sy+24],[sxL-4,sy+46], [sxR+13,sy-6],[sxR+15,sy-26]],
    think: [[sxL-3,sy+24],[sxL-4,sy+46], [sxR+6,sy+22],[56,sy-14]],
    sad:   [[sxL-1,sy+24],[sxL+1,sy+46], [sxR+1,sy+24],[sxR-1,sy+46]],
    reach: [[sxL-3,sy+24],[sxL-4,sy+46], [sxR+12,sy+20],[sxR+24,sy+36]],
    hug:   [[sxL-6,sy+14],[sxL+26,sy+12], [sxR+14,sy+8],[sxR+30,sy+4]],
    kiss:  [[sxL-3,sy+24],[sxL-4,sy+46], [sxR+14,sy+16],[sxR+26,sy+20]],
    dance: [[sxL-12,sy+6],[sxL-18,sy-12], [sxR+12,sy+16],[sxR+20,sy+30]],
    sign:  [[sxL-4,sy+18],[sxL+4,sy+30], [sxR+4,sy+18],[sxR-4,sy+30]],
    give:  [[sxL-3,sy+24],[sxL-4,sy+46], [sxR+12,sy+14],[sxR+22,sy+16]]
  };
  return P[mood]||P.idle;
}
function avatarSVG2D(p, mood="idle", o={}){
  const sk=SKINS[p.skin]||SKINS[0], hc=HAIRC[p.hairColor]||HAIRC[0], sh=SHIRTS[p.shirt]||SHIRTS[0];
  const build=p.build||0, buff=build===1, dress=build===2, ln=shade(sk,-42), hl=shade(hc,34);
  const fem=dress;
  // ombros
  const sy=70, sxL=buff?28:(dress?38:34), sxR=100-sxL;
  const pose=armPose(mood==="eat"?"idle":mood, sxL, sxR, sy);
  // ---------- cabelo de trás
  let back="", front="";
  switch(p.hair){
    case 1: back=`<path d="M33 40 C31 16 69 16 67 40 L71 116 Q61 124 50 119 Q39 124 29 116 Z" fill="${hc}"/>`;
      front=`<path d="M33.5 41 C33 25 42 20 50 20 C58 20 67 25 66.5 41 C64 33 59 28.5 51 27.5 L50 25 L49 27.5 C41 28.5 36 33 33.5 41Z" fill="${hc}"/>
        <path d="M33.5 40 C32.5 50 33 62 31 74 Q35 76 37 71 C37 58 37 48 39 38 Z" fill="${hc}"/><path d="M66.5 40 C67.5 50 67 62 69 74 Q65 76 63 71 C63 58 63 48 61 38 Z" fill="${hc}"/>
        <path d="M44 24 Q40 30 38 38 M57 24 Q61 30 62.5 38" stroke="${hl}" stroke-width="1.2" fill="none" opacity=".7"/>`; break;
    case 5: back=`<path d="M31 50 C27 13 73 11 69 50 L70 61 Q66 64 64 57 L36 57 Q34 64 30 61 Z" fill="${hc}"/>`;
      front=`<path d="M31.5 48 C27 13 73 10 68.5 48 C67 42 65.5 38 63 35.5 Q62 41 58 44 Q59 37 55.5 33.5 Q53.5 40 48 43 Q50 36 46.5 33 Q43 39 38.5 41.5 Q40.5 36 39 34.5 Q35 39 31.5 48Z" fill="${hc}"/>
        <path d="M39 27 Q50 22 61 27.5 M42 31.5 Q52 28 63 33" stroke="${hl}" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".7"/>`; break;
    case 0: front=`<path d="M33 43 C32 22 68 20 67 43 C64 34 58 30 50 31 C43 29 36 33 33 43Z" fill="${hc}"/>`; break;
    case 2: back=[[34,36],[38,26],[46,21],[55,21],[63,26],[67,36],[67,46],[33,46]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="7.5" fill="${hc}"/>`).join("");
      front=[[37,35],[43,29],[50,27],[57,29],[63,35]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5.5" fill="${hc}"/>`).join(""); break;
    case 3: back=`<circle cx="50" cy="18" r="8" fill="${hc}"/>`; front=`<path d="M33 42 C33 24 67 24 67 42 C63 32 57 29 50 29 C43 29 37 32 33 42Z" fill="${hc}"/>`; break;
    default: front="";
  }
  // ---------- pernas
  const legC = dress? sk : (buff? "#3a3d4f" : "#34374a");
  const shoe = dress? "#e9b98f" : "#f4f1ec";
  let legs;
  if(dress) legs=`<g class="legL" style="transform-origin:45.5px 132px;transform-box:view-box"><path d="M45.5 132 L45 184" stroke="${ln}" stroke-width="7.2" stroke-linecap="round"/><path d="M45.5 132 L45 184" stroke="${sk}" stroke-width="5.6" stroke-linecap="round"/><ellipse cx="44" cy="187" rx="5.5" ry="2.8" fill="${shoe}"/><path d="M41 185 L47 185" stroke="#c98f62" stroke-width="1.2"/></g>
                  <g class="legR" style="transform-origin:54.5px 132px;transform-box:view-box"><path d="M54.5 132 L55 184" stroke="${ln}" stroke-width="7.2" stroke-linecap="round"/><path d="M54.5 132 L55 184" stroke="${sk}" stroke-width="5.6" stroke-linecap="round"/><ellipse cx="56" cy="187" rx="5.5" ry="2.8" fill="${shoe}"/><path d="M53 185 L59 185" stroke="#c98f62" stroke-width="1.2"/></g>`;
  else legs=`<g class="legL" style="transform-origin:43.5px 112px;transform-box:view-box"><path d="M43.5 112 L42 183" stroke="${legC}" stroke-width="${buff?12:10.5}" stroke-linecap="round"/><ellipse cx="40.5" cy="187" rx="7.5" ry="3.6" fill="${shoe}" stroke="rgba(0,0,0,.18)" stroke-width="1"/></g>
             <g class="legR" style="transform-origin:56.5px 112px;transform-box:view-box"><path d="M56.5 112 L58 183" stroke="${legC}" stroke-width="${buff?12:10.5}" stroke-linecap="round"/><ellipse cx="59.5" cy="187" rx="7.5" ry="3.6" fill="${shoe}" stroke="rgba(0,0,0,.18)" stroke-width="1"/></g>`;
  // ---------- tronco
  let torso="";
  if(buff){
    torso=`<path d="M22 72 Q50 60 78 72 Q75 92 66 114 L34 114 Q25 92 22 72Z" fill="${sk}" stroke="${ln}" stroke-width="1"/>
      <path d="M36 66 L41.5 64.5 Q50 80 58.5 64.5 L64 66 Q68 82 63.5 94 L64.5 116 L35.5 116 L36.5 94 Q32 82 36 66Z" fill="${sh}"/>
      <path d="M41 90 Q45.5 93 50 90.5 Q54.5 93 59 90" stroke="rgba(255,255,255,.12)" stroke-width="1.4" fill="none"/>
      <path d="M30 80 Q33 92 36 96 M70 80 Q67 92 64 96" stroke="${ln}" stroke-width=".9" fill="none" opacity=".5"/>`;
  } else if(dress){
    torso=`<path d="M38 70 Q50 64 62 70 L60.5 82 L39.5 82Z" fill="${sk}" stroke="${ln}" stroke-width=".8"/>
      <path d="M40 74 L60 74 L60 99 Q50 102 40 99 Z" fill="${sh}"/>
      <path d="M41 74 L42.5 66 M59 74 L57.5 66" stroke="${sh}" stroke-width="1.6"/>
      <path d="M40 97 Q50 101 60 97 L60.5 101 Q50 105 39.5 101 Z" fill="${shade(sh,-30)}"/>
      <path d="M39.5 100 Q50 104 60.5 100 L73 136 Q50 144 27 136 Z" fill="${sh}"/>
      <path d="M44 103 L39 136 M50 104 L50 139 M56 103 L61 136" stroke="${shade(sh,-22)}" stroke-width="1" opacity=".6"/>
      ${[[36,120],[47,126],[58,118],[64,130],[42,134],[53,113]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.4" fill="#fff" opacity=".85"/>`).join("")}`;
  } else {
    torso=`<path d="M31 72 Q50 64 69 72 L71 88 L66 86 L66 116 L34 116 L34 86 L29 88 Z" fill="${sh}"/>
      <path d="M44 67 Q50 73 56 67" stroke="rgba(0,0,0,.18)" stroke-width="1.6" fill="none"/>`;
  }
  if(p.acc===2) torso+=`<path d="M42.5 63.5 Q50 79 57.5 63.5" stroke="#f0cf6a" stroke-width="1.1" fill="none"/><circle cx="50" cy="72.5" r="1.5" fill="#f0cf6a"/>`;
  // ---------- braços
  const armW = buff? [12.5,9.5] : dress? [5.6,5] : [8,7];
  const handR = buff? 4.6 : dress? 3.1 : 3.8;
  const sleeve = !buff && !dress;
  function arm(side){
    const sx= side?sxR:sxL, [e,h]= side? [pose[2],pose[3]] : [pose[0],pose[1]];
    const up=`M${sx} ${sy+2} L${e[0]} ${e[1]}`, lo=`M${e[0]} ${e[1]} L${h[0]} ${h[1]}`;
    const bx=sx+(e[0]-sx)*.5, by=sy+2+(e[1]-sy-2)*.5, ang=Math.atan2(e[1]-sy,e[0]-sx)*57.3;
    let outl=`<path d="${up}" stroke="${ln}" stroke-width="${armW[0]+1.5}" stroke-linecap="round"/><path d="${lo}" stroke="${ln}" stroke-width="${armW[1]+1.5}" stroke-linecap="round"/>`;
    let fill=`<path d="${up}" stroke="${sleeve?sh:sk}" stroke-width="${armW[0]}" stroke-linecap="round"/><path d="${lo}" stroke="${sk}" stroke-width="${armW[1]}" stroke-linecap="round"/>`;
    if(buff){
      outl+=`<circle cx="${sx}" cy="${sy+1.5}" r="8" fill="${ln}"/><ellipse cx="${bx}" cy="${by}" rx="7.6" ry="6.6" fill="${ln}" transform="rotate(${ang} ${bx} ${by})"/>`;
      fill+=`<circle cx="${sx}" cy="${sy+1.5}" r="7.2" fill="${sk}"/><ellipse cx="${bx}" cy="${by}" rx="6.8" ry="5.8" fill="${sk}" transform="rotate(${ang} ${bx} ${by})"/>
        <path d="M${bx-3} ${by+3} Q${bx} ${by+4.5} ${bx+3} ${by+3}" stroke="${ln}" stroke-width=".8" fill="none" opacity=".55" transform="rotate(${ang} ${bx} ${by})"/>`;
    }
    if(sleeve){ const mx=(sx+e[0])/2, my=(sy+2+e[1])/2; fill+=`<path d="M${mx} ${my} L${e[0]} ${e[1]}" stroke="${sk}" stroke-width="${armW[0]-.6}" stroke-linecap="round"/>`; }
    const hand=`<circle cx="${h[0]}" cy="${h[1]}" r="${handR+.7}" fill="${ln}"/><circle cx="${h[0]}" cy="${h[1]}" r="${handR}" fill="${sk}"/>`;
    return `<g class="${side?"armR":"armL"}" style="transform-origin:${sx}px ${sy+2}px;transform-box:view-box">${outl}${fill}${hand}</g>`;
  }
  // ---------- rosto
  const eyY=44, eL=43.5, eR=56.5;
  const closed=(x)=>`<path d="M${x-3.2} ${eyY} Q${x} ${eyY+2.6} ${x+3.2} ${eyY}" stroke="${INK}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  const arc=(x)=>`<path d="M${x-3.2} ${eyY+1} Q${x} ${eyY-3} ${x+3.2} ${eyY+1}" stroke="${INK}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  const open=(x,dy=0)=>`<ellipse cx="${x}" cy="${eyY+dy}" rx="2.4" ry="3" fill="${INK}"/><circle cx="${x+.9}" cy="${eyY+dy-1.1}" r=".9" fill="#fff"/>`+(fem?`<path d="M${x+(x<50?-2.4:2.4)} ${eyY+dy-1.6} L${x+(x<50?-4.4:4.4)} ${eyY+dy-3.4}" stroke="${INK}" stroke-width="1" stroke-linecap="round"/>`:"");
  let eyes, brows, mouth, extra="";
  const bw=fem?1:1.7;
  brows=`<path d="M${eL-3.5} ${eyY-6} Q${eL} ${eyY-7.5} ${eL+3.2} ${eyY-6.2}" stroke="${shade(hc,10)}" stroke-width="${bw}" fill="none" stroke-linecap="round"/><path d="M${eR-3.2} ${eyY-6.2} Q${eR} ${eyY-7.5} ${eR+3.5} ${eyY-6}" stroke="${shade(hc,10)}" stroke-width="${bw}" fill="none" stroke-linecap="round"/>`;
  const lip=fem?"#e2788a":"#b86a6a";
  if(mood==="happy"||mood==="dance"||mood==="give"){ eyes=arc(eL)+arc(eR); mouth=`<path d="M46.5 51.5 Q50 56 53.5 51.5Z" fill="#8a3a44" stroke="#8a3a44" stroke-width=".8" stroke-linejoin="round"/>`; }
  else if(mood==="kiss"||mood==="hug"){ eyes=closed(eL)+closed(eR); mouth= mood==="kiss"? `<ellipse cx="52" cy="52.5" rx="1.8" ry="1.5" fill="${lip}"/>` : `<path d="M47 51.5 Q50 54 53 51.5" stroke="${INK}" stroke-width="1.3" fill="none" stroke-linecap="round"/>`; extra=`<ellipse cx="40" cy="50" rx="3.6" ry="2" fill="#ff7a8a" opacity=".55"/><ellipse cx="60" cy="50" rx="3.6" ry="2" fill="#ff7a8a" opacity=".55"/>`; }
  else if(mood==="sad"){ eyes=`<g class="eyes">${open(eL,1)}${open(eR,1)}</g>`; brows=`<path d="M${eL-3.5} ${eyY-5} L${eL+3} ${eyY-7}" stroke="${shade(hc,10)}" stroke-width="${bw}" stroke-linecap="round"/><path d="M${eR+3.5} ${eyY-5} L${eR-3} ${eyY-7}" stroke="${shade(hc,10)}" stroke-width="${bw}" stroke-linecap="round"/>`; mouth=`<path d="M47 53.5 Q50 51 53 53.5" stroke="${INK}" stroke-width="1.3" fill="none" stroke-linecap="round"/>`; extra=`<path d="M57.5 48 Q59 51.5 57.5 53 Q56 51.5 57.5 48Z" fill="#7cc4f0"/>`; }
  else if(mood==="think"){ eyes=`<g class="eyes">${open(eL-1,-1.4)}${open(eR-1,-1.4)}</g>`; mouth=`<ellipse cx="52" cy="52.5" rx="1.6" ry="1.2" fill="#8a3a44"/>`; }
  else { eyes=`<g class="eyes">${open(eL)}${open(eR)}</g>`; mouth= fem? `<path d="M47 51.3 Q50 54.6 53 51.3 Q50 52.6 47 51.3Z" fill="${lip}" stroke="${lip}" stroke-width="1" stroke-linejoin="round"/>` : `<path d="M46.8 51.5 Q50 54.4 53.2 51.5" stroke="${INK}" stroke-width="1.3" fill="none" stroke-linecap="round"/>`; }
  const nose=`<path d="M50.3 46.5 Q51.8 49 49.6 49.4" stroke="${ln}" stroke-width="1" fill="none" stroke-linecap="round"/>`;
  const cheeks=`<ellipse cx="40.5" cy="50" rx="3" ry="1.6" fill="#ff8a9a" opacity=".35"/><ellipse cx="59.5" cy="50" rx="3" ry="1.6" fill="#ff8a9a" opacity=".35"/>`;
  const face = fem
    ? `<path d="M34.5 40 C34.5 27 42 22 50 22 C58 22 65.5 27 65.5 40 C65.5 50 60 58.5 50 59.5 C40 58.5 34.5 50 34.5 40Z" fill="${sk}" stroke="${ln}" stroke-width=".9"/>`
    : `<path d="M34 40 C34 26 42 21.5 50 21.5 C58 21.5 66 26 66 40 C66 50 62 57 55 59.5 Q50 61 45 59.5 C38 57 34 50 34 40Z" fill="${sk}" stroke="${ln}" stroke-width=".9"/>`;
  // ---------- acessórios
  let flower="";
  if(p.acc===1){ const cx=63, cy=27; flower=`<g transform="translate(${cx} ${cy}) scale(.62)">`+Array.from({length:12},(_,k)=>`<ellipse cx="0" cy="-8" rx="3.4" ry="6.8" fill="${k%2?"#ffd23f":"#f7b500"}" transform="rotate(${k*30})"/>`).join("")+`<circle r="5.6" fill="#6b3a1d"/><circle cx="-1.6" cy="-1.5" r="1" fill="#a0602d"/><circle cx="1.8" cy=".6" r="1" fill="#a0602d"/></g>`; }
  const crown = o.crown ? `<g transform="translate(0 4)"><path d="M38 14 L41 2 L46 9 L50 -1 L54 9 L59 2 L62 14 Z" fill="#ffcc33" stroke="#d99a1e" stroke-width="1.2"/><circle cx="50" cy="-1" r="2" fill="#ff7a93"/></g>` : "";
  let sign="";
  if(mood==="sign"){ const t=esc((o.sign||"?????").toUpperCase());
    sign=`<rect x="20" y="84" width="60" height="24" rx="4" fill="#fffaf2" stroke="#c9b3bf" stroke-width="1.6"/><text x="50" y="100.5" text-anchor="middle" font-family="Fredoka,ui-rounded,system-ui" font-weight="700" font-size="${t.length>5?10:13}" fill="${o.revealed?'#3aa394':'#6e5764'}" letter-spacing="1.5">${t}</text>`; }
  const holding = o.hold ? `<text x="${pose[3][0]}" y="${pose[3][1]+3}" font-size="12" text-anchor="middle">${o.hold}</text>` : "";
  const vb = o.vb || "0 -6 100 200";
  return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="50" cy="189" rx="20" ry="4" fill="rgba(0,0,0,.18)"/>
    ${back}
    ${legs}
    <rect x="${fem?46:44.5}" y="54" width="${fem?8:11}" height="14" rx="3" fill="${sk}" stroke="${ln}" stroke-width=".8"/>
    ${torso}
    ${mood==="sign"? "" : arm(0)+arm(1)}

}
function av(i, mood="idle", o={}){
  return `<div class="avatar m-${mood} ${o.cls||""}" data-p="${i}"><div class="fig">${avatarSVG(S.players[i],mood,o)}</div><div class="bubble"></div></div>`;
}
function head(i){ return `<div class="headDot">${avatarSVG(S.players[i],"idle",{vb:"30 14 40 40"})}</div>`; }
function setMood(i, mood, o={}){
  document.querySelectorAll(`.avatar[data-p="${i}"]`).forEach(el=>{
    [...el.classList].forEach(c=>{ if(c.startsWith("m-")) el.classList.remove(c); });
    el.classList.add("m-"+mood);
    el.querySelector(".fig").innerHTML = avatarSVG(S.players[i],mood,o);
  });
}
const bubbleT={};
function say(i, text, ms=2400){
  document.querySelectorAll(`.avatar[data-p="${i}"] .bubble, .ov3[data-p="${i}"] .bubble`).forEach(el=>{
    el.innerHTML=artText(text); el.classList.add("show");
    clearTimeout(bubbleT[i]); bubbleT[i]=setTimeout(()=>el.classList.remove("show"),ms);
  });
}
function hearts(container, x, y, set=["💖","💕","❤️","💗"], n=7){
  for(let k=0;k<n;k++){ const f=document.createElement("span"); f.className="fly"; f.innerHTML=icon(pick(set));
    f.style.left=x+"px"; f.style.top=y+"px"; f.style.setProperty("--dx",(Math.random()*110-55)+"px"); f.style.animationDelay=(k*.08)+"s";
    container.appendChild(f); setTimeout(()=>f.remove(),2200); }
}

  const c=document.createElement("canvas"); c.width=c.height=128; const t=new THREE.CanvasTexture(c); T3[key]=t;
  const name=EMO2ICO[e]||e;
  if(ICONS[name]){ const im=new Image(); im.onload=()=>{ c.getContext("2d").drawImage(im,8,8,112,112); t.needsUpdate=true; };
    im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="112" height="112">${ICONS[name].replace(/Fredoka,system-ui/g,"sans-serif")}</svg>`); }
  else { const x=c.getContext("2d"); x.font="96px serif"; x.textAlign="center"; x.textBaseline="middle"; x.fillText(e,64,72); t.needsUpdate=true; }
  return t;
}

/* =================== SONS (sintetizados, sem arquivos) =================== */
const SFX={ctx:null, master:null, musicGain:null, musicOn:false, mt:0};
function ac(){
  if(!SFX.ctx){ try{ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; SFX.ctx=new C(); SFX.master=SFX.ctx.createGain(); SFX.master.gain.value=.42; SFX.master.connect(SFX.ctx.destination); }catch(e){ return null; } }
  if(SFX.ctx.state==="suspended") SFX.ctx.resume().catch(()=>{});
  return SFX.ctx;
}
document.addEventListener("pointerdown",()=>{ ac(); if(S.music!==false) startMusic(); },{passive:true});
function tone(f, d=.15, type="sine", v=.14, at=0, f2=null, out){
  const c=ac(); if(!c||S.mute) return; const t=c.currentTime+at, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(out||SFX.master); o.start(t); o.stop(t+d+.05);
}
function noise(d=.1, v=.1, at=0, freq=1200, q=1, type="bandpass"){
  const c=ac(); if(!c||S.mute) return; const t=c.currentTime+at, n=Math.floor(c.sampleRate*d), b=c.createBuffer(1,n,c.sampleRate), ch=b.getChannelData(0);
  for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q; const g=c.createGain(); g.gain.value=v;
  s.connect(f); f.connect(g); g.connect(SFX.master); s.start(t);
}
const NOTE=n=>440*Math.pow(2,(n-69)/12);
function snd(name, arg){
  if(S.mute) return; const c=ac(); if(!c) return;
  switch(name){
    case "tap": tone(660,.06,"triangle",.08); break;
    case "pop": tone(520,.09,"sine",.12,0,900); break;
    case "close": tone(700,.08,"sine",.08,0,420); break;
    case "step": noise(.05,.05,0,500,2); break;
    case "kiss": tone(900,.12,"sine",.12,0,1500); tone(1300,.16,"sine",.1,.14,700); [0,1,2].forEach(k=>tone(NOTE(84+k*4),.25,"triangle",.05,.32+k*.07)); break;
    case "hug": [72,76,79,84].forEach((n,k)=>tone(NOTE(n),.5,"triangle",.07,k*.08)); break;
    case "dance": [72,74,76,79,76,74,72,79].forEach((n,k)=>tone(NOTE(n),.16,"square",.035,k*.16)); break;
    case "sparkle": [88,91,96].forEach((n,k)=>tone(NOTE(n),.18,"sine",.05,k*.06)); break;
    case "chime": [79,84,88].forEach((n,k)=>tone(NOTE(n),.35,"triangle",.07,k*.09)); break;
    case "ding": tone(NOTE(88),.4,"sine",.1); tone(NOTE(95),.5,"sine",.06,.12); break;
    case "win": [72,76,79,84,79,84,88].forEach((n,k)=>tone(NOTE(n),k===6?.6:.16,"triangle",.09,k*.12)); break;
    case "lose": [67,63,60].forEach((n,k)=>tone(NOTE(n),.3,"triangle",.08,k*.2)); break;
    case "flip": tone(1100,.04,"square",.035); noise(.03,.04,0,3000,1); break;
    case "good": tone(NOTE(84),.12,"triangle",.07); break;
    case "meh": tone(NOTE(76),.1,"triangle",.05); break;
    case "bad": tone(160,.15,"sawtooth",.05,0,120); break;
    case "key": noise(.02,.05,0,2500,1); break;
    case "ball": noise(.25,.05,0,800,.7); tone(NOTE(81),.12,"sine",.1,.22); break;
    case "bingo": snd("win"); break;
    case "found": [76,83,88].forEach((n,k)=>tone(NOTE(n),.2,"triangle",.08,k*.07)); break;
    case "water": for(let k=0;k<6;k++) tone(700+Math.random()*900,.08,"sine",.07,k*.09,300); break;
    case "plant": noise(.12,.12,0,300,1,"lowpass"); tone(220,.12,"sine",.08,.02,160); break;
    case "bloom": snd("sparkle"); snd("chime"); break;
    case "eat": for(let k=0;k<4;k++) noise(.05,.09,k*.13,1800,2); break;
    case "bubbles": for(let k=0;k<7;k++) tone(500+Math.random()*700,.07,"sine",.06,k*.08,1400); break;
    case "throw": noise(.18,.05,0,1500,.6,"highpass"); break;
    case "splash": noise(.4,.08,0,900,.5); break;
    case "camera": noise(.04,.12,0,4000,1); noise(.06,.08,.08,2500,1); break;
    case "brush": noise(.08,.03,0,2000,.8); break;
    case "adopt": [72,79,84,88,91].forEach((n,k)=>tone(NOTE(n),.2,"triangle",.07,k*.08)); break;
    case "count": tone(NOTE(81),.15,"square",.06); break;
    case "go": tone(NOTE(93),.35,"square",.07); break;
    case "pet": petSound(arg); break;
    case "door": noise(.12,.06,0,500,1.5); tone(180,.12,"triangle",.06,.02,120); tone(NOTE(79),.12,"sine",.04,.18); tone(NOTE(84),.18,"sine",.04,.28); break;
    case "click2": tone(1400,.03,"square",.04); tone(900,.04,"square",.03,.05); break;
    case "dig": for(let k=0;k<3;k++) noise(.07,.04,k*.11,600,1.5); break;
    case "snap": noise(.05,.12,0,2600,1); tone(140,.12,"triangle",.1,0,70); noise(.3,.06,.05,900,.7); break;
    case "purr": for(let k=0;k<44;k++) noise(.035,.06*(.6+.4*Math.sin(k/44*Math.PI)),k*.042,170,1.2,"lowpass"); break;
    case "jump": noise(.25,.05,0,1800,.6,"highpass"); tone(300,.25,"sine",.07,0,700); break;
    case "dive": noise(.55,.16,0,650,.5); noise(.3,.08,.05,2400,.7); for(let k=0;k<6;k++) tone(260+Math.random()*420,.08,"sine",.05,.25+k*.07,700); break;
    case "stroke": noise(.14,.045,0,1100+Math.random()*400,.8); break;
    case "swimout": for(let k=0;k<4;k++) tone(1300+Math.random()*700,.06,"sine",.05,k*.15,600); noise(.2,.05,0,900,.6); break;
    case "cast": noise(.28,.06,0,2600,.5,"highpass"); tone(1100,.25,"sine",.03,0,350); break;
    case "plop": tone(520,.12,"sine",.13,0,170); noise(.08,.05,0,1300,1); break;
    case "nibble": tone(720,.05,"sine",.06); tone(660,.05,"sine",.05,.08); break;
    case "bite": [0,1,2].forEach(k=>tone(NOTE(86),.07,"square",.06,k*.09)); snd("plop"); break;
    case "hook": noise(.2,.1,0,900,.6); tone(NOTE(79),.12,"triangle",.08,.05); tone(NOTE(86),.16,"triangle",.08,.15); break;
    case "reel": tone(1650+Math.random()*250,.025,"square",.016); break;
    case "good2": tone(NOTE(88+Math.floor(Math.random()*3)*2),.07,"sine",.025); break;
    case "escape": tone(520,.32,"triangle",.07,0,190); noise(.3,.06,.1,800,.6); break;
    case "catch": noise(.45,.12,0,700,.5); [84,88,91].forEach((n,k)=>tone(NOTE(n),.2,"sine",.06,.2+k*.06)); break;
    case "fanfare": { const r=arg|0, seqs=[[72,76,79],[72,76,79,84],[72,76,79,84,88,91],[67,72,76,79,84,88,91,96],[72,76,79,84,88,91,96,100,103]]; seqs[r].forEach((n,k)=>tone(NOTE(n),k===seqs[r].length-1?.7:.16,"triangle",.08,k*.1)); if(r>=3) [0,1,2,3,4,5].forEach(k=>tone(NOTE(96+k*2),.3,"sine",.03,.4+k*.08)); break; }
    case "frog": if(playSample("frog",.45,.95+Math.random()*.1)) break; [0,1].forEach(k=>{ tone(190,.13,"sawtooth",.045,k*.2,120); noise(.1,.03,k*.2,500,4); }); break;
  }
}
function waterLoop(v){
  const c=SFX.ctx; if(!c||c.state!=="running") return;
  if(!SFX.wl){ const n=c.sampleRate*2, b=c.createBuffer(1,n,c.sampleRate), ch=b.getChannelData(0); let l=0; for(let i=0;i<n;i++){ l=l*.6+(Math.random()*2-1)*.4; ch[i]=l; }
    const s=c.createBufferSource(); s.buffer=b; s.loop=true; const f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1600; f.Q.value=.5; const g=c.createGain(); g.gain.value=0; s.connect(f); f.connect(g); g.connect(SFX.master); s.start(); SFX.wl=g; }
  SFX.wl.gain.setTargetAtTime(S.mute?0:v, c.currentTime, .25);
}
function petSound(sp,vol=1){
  const r=.92+Math.random()*.16;
  switch(sp){
    case "dog": if(playSample(pick(["dog1","dog2","dog3","dog4"]),.75*vol,r)) return; tone(420,.09,"sawtooth",.07*vol,0,300); noise(.06,.05*vol,0,900,2); tone(440,.09,"sawtooth",.07*vol,.18,310); break;
    case "cat": if(playSample(pick(["cat1","cat2","cat3"]),.65*vol,r)) return; tone(700,.45,"triangle",.07*vol,0,980); tone(980,.25,"triangle",.05*vol,.4,600); break;
    case "pig": if(playSample(pick(["pig1","pig2"]),.75*vol,r)) return; [0,1].forEach(k=>{ tone(180,.18,"sawtooth",.07*vol,k*.22,130); noise(.15,.04*vol,k*.22,400,3); }); break;
    case "parrot": if(Math.random()<.6? playSample("crow",.35*vol,1.6+Math.random()*.25) : playSample(pick(["bird1","bird2"]),.4*vol,1.25)) return; tone(1200,.12,"square",.05*vol,0,1800); tone(1600,.15,"square",.05*vol,.14,900); break;
    case "bunny": for(let k=0;k<4;k++) noise(.05,.05*vol,k*.09,5200,1.2,"highpass"); tone(2600,.04,"sine",.015*vol,.4,3200); break;
    case "hamster": for(let k=0;k<3;k++){ const f=3200+Math.random()*900; tone(f,.06,"sine",.05*vol,k*.09,f*1.25); } break;
    case "turtle": case "jabuti": noise(.45,.05*vol,0,3200,.7,"highpass"); for(let k=0;k<3;k++) noise(.05,.04*vol,.5+k*.12,700,2); break;
    case "jacare": noise(.6,.09*vol,0,140,1.5,"lowpass"); tone(55,.5,"sawtooth",.05*vol,0,45); noise(.5,.04*vol,.5,3000,.6,"highpass"); break;
  }
}
/* musiquinha de fundo (suave e gerada na hora) */
function startMusic(){
  if(SFX.musicOn || S.mute || S.music===false) return; const c=ac(); if(!c) return;
  SFX.musicOn=true; SFX.musicGain=c.createGain(); SFX.musicGain.gain.value=.0001; SFX.musicGain.connect(SFX.master);
  SFX.musicGain.gain.exponentialRampToValueAtTime(.22,c.currentTime+2);
  const chords=[[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,65]], mel=[76,79,81,79,76,74,72,74, 72,76,74,71,72,74,76,79];
  let bar=0; const beat=.75;
  const sched=()=>{
    if(!SFX.musicOn) return; const ch=chords[bar%4];
    ch.forEach(n=>tone(NOTE(n),beat*4,"sine",.018,0,null,SFX.musicGain));
    tone(NOTE(ch[0]-12),beat*2,"triangle",.03,0,null,SFX.musicGain); tone(NOTE(ch[0]-12),beat*2,"triangle",.025,beat*2,null,SFX.musicGain);
    for(let k=0;k<4;k++){ if(Math.random()<.75) tone(NOTE(mel[(bar*4+k)%16]),beat*.9,"triangle",.022,k*beat,null,SFX.musicGain); }
    bar++; SFX.mt=setTimeout(sched, beat*4*1000);
  };
  sched();
}
function stopMusic(){ SFX.musicOn=false; clearTimeout(SFX.mt); if(SFX.musicGain){ try{ SFX.musicGain.gain.exponentialRampToValueAtTime(.0001,SFX.ctx.currentTime+.6); }catch(e){} } }
function soundModal(){
  const m=modal(`<h2>🎵 Sons</h2>
    <div class="stack"><button class="btn ${S.mute?"alt":""}" id="sfx">${S.mute?"Sons desligados":"Sons ligados ✓"}</button>
    <button class="btn ${S.music===false||S.mute?"alt":"pink"}" id="mus">${S.music===false?"Música desligada":"Música ligada ✓"}</button>
    <p style="font-size:.85rem;text-align:center">No iPhone, a chavinha de silencioso também desliga os sons do jogo.</p>
    <button class="btn alt" data-close>Fechar</button></div>`);
  m.querySelector("#sfx").onclick=()=>{ S.mute=!S.mute; save(); if(S.mute) stopMusic(); else { snd("pop"); startMusic(); } m.remove(); soundModal(); };
  m.querySelector("#mus").onclick=()=>{ S.music=S.music===false; save(); if(S.music===false) stopMusic(); else startMusic(); m.remove(); soundModal(); };
}

/* =================== UI HELPERS =================== */
const app=document.getElementById("app");
let keyHandler=null, screenNet=null, screenCleanup=null, curScreen="";
function render(html, name=""){
  keyHandler=null; screenNet=null; if(screenCleanup){ try{screenCleanup();}catch(e){} } screenCleanup=null; curScreen=name;
  document.querySelectorAll(".modalBg").forEach(m=>m.remove());
  app.innerHTML=`<div class="screen">${artify(html)}</div>`; return app.firstChild;
}
function toast(msg, ms=1800){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div"); t.className="toast"; t.innerHTML=artText(msg); app.appendChild(t);
  setTimeout(()=>t.remove(), ms);
}
function modal(html){
  document.querySelectorAll(".modalBg").forEach(m=>m.remove());
  const bg=document.createElement("div"); bg.className="modalBg"; bg.innerHTML=`<div class="modal">${artify(html)}</div>`; snd("pop");
  bg.addEventListener("click",e=>{ if(e.target===bg || e.target.closest("[data-close]")) bg.remove(); });
  document.body.appendChild(bg); return bg;
}
function topbar(title, back){
  return `<div class="top"><button class="ibtn" data-act="back" aria-label="Voltar">${back?"‹":"✕"}</button><h1>${title}</h1><button class="ibtn" data-act="help" aria-label="Ajuda">?</button></div>`;
}
function bindTop(root, onBack, helpFn){
  root.querySelector('[data-act="back"]').onclick=onBack;
  root.querySelector('[data-act="help"]').onclick=helpFn||showHelp;
}
function confirmBox(title, text, yes, onYes){
  const m=modal(`<h2>${title}</h2><p>${text}</p><div class="row2" style="margin-top:14px"><button class="btn alt small" data-close>Cancelar</button><button class="btn pink small" id="yes">${yes}</button></div>`);
  m.querySelector("#yes").onclick=()=>{ m.remove(); onYes(); };
}
async function copyText(text, holder){
  try{ await navigator.clipboard.writeText(text); toast("Copiado! 📋"); }
  catch(e){
    let ta=holder.querySelector("textarea.copyFallback");
    if(!ta){ ta=document.createElement("textarea"); ta.className="copyFallback"; holder.appendChild(ta); }
    ta.value=text; ta.focus(); ta.select(); toast("Segura no texto e toca em Copiar",2200);
  }
}
const waLink = t => "https://wa.me/?text="+encodeURIComponent(t);

/* =================== ONLINE (banco compartilhado) =================== */
const NET={db:null, on:false, ro:false, docs:{}, subs:{}, w:{}, ready:false};
const hubPath = i => "hub/p"+i;
let myHub={};
function online(){ return NET.on && !NET.ro; }
function partnerHere(){ if(NET.p2p) return online() && NET.p2p.connected() && NET.partnerRole!==S.me; const d=NET.docs[hubPath(other())]; return !!(online() && d && d.act && Date.now()-d.act < 3*60e3); }
function push(path, data){
  if(!online()) return;
  const w=NET.w[path]||(NET.w[path]={busy:false,next:null}); w.next=data;
  if(!w.busy) flush(path);
}
async function flush(path){
  const w=NET.w[path]; if(!w.next){ w.busy=false; return; }
  const d=w.next; w.next=null; w.busy=true;
  try{ await NET.db.doc(path).set(d); }
  catch(e){
    const c=e&&e.code;
    if(c==="invalid_argument"||c==="revoked"||c==="not_granted"||c==="capability_disabled"){ goOffline("Sem permissão pra jogar online por aqui — dá pra jogar no mesmo celular."); }
    else if(c==="unavailable"){ await new Promise(r=>setTimeout(r,600+Math.random()*800)); if(!w.next) w.next=d; }
  }
  w.busy=false; if(w.next) flush(path);
}
function goOffline(msg){ if(NET.ro) return; NET.ro=true; toast(msg,3200); refreshStatus(); }
function pushMe(extra={}){
  myHub=Object.assign({}, myHub, {look:S.players[S.me], act:Date.now()}, extra);
  push(hubPath(S.me), myHub);
}
async function initNet(){
  try{
    let db=null;
    if(window.claude && typeof window.claude.use==="function") db=await window.claude.use("db");
    else if(window.Peer && ROOM.indexOf("__")!==0){
      NET.p2p=makeP2PDB(); NET.p2p.onState=()=>{ refreshStatus(); if(curScreen==="hub") refreshBanners(); if(S.picked && NET.p2p.connected() && NET.partnerRole===S.me && !document.querySelector(".roleFix")) roleConflict(); };
      if(S.picked) NET.p2p.start(S.me); db=NET.p2p.db;
    }
    if(!db) return;
    NET.db=db;
    // testa escrita: se não puder escrever, fica no modo mesmo celular
    const me=S.me; myHub={look:S.players[me], act:Date.now(), x:S.pos[me].x, y:S.pos[me].y, place:"hub"};
    try{ await db.doc(hubPath(me)).set(myHub); }catch(e){ return; }
    NET.on=true;
    const paths=[hubPath(0),hubPath(1),"jogos/bingo","jogos/caca","jogos/termo","jogos/pra-p0","jogos/pra-p1",
      "jogos/bingo-p0","jogos/bingo-p1","jogos/coop","jardim/canteiros","pintura/tela","pintura/p0","pintura/p1","jogos/caca-p0","jogos/caca-p1","jogos/termo-p0","jogos/termo-p1","pesca/p0","pesca/p1","jogos/quiz","jogos/quiz-p0","jogos/quiz-p1","jogos/stop","jogos/stop-p0","jogos/stop-p1","jogos/desenho","jogos/desenho-p0","jogos/desenho-p1"];
    paths.forEach(p=>{ NET.subs[p]=db.doc(p).onSnapshot(s=>{ NET.docs[p]=s.exists?s.data():null; netChanged(p); }, e=>{}); });
    NET.ready=true; initPetsNet(); refreshStatus();
  }catch(e){}
}
function netChanged(path){
  if(path===hubPath(other())){
    const d=NET.docs[path];
    if(d && d.look && typeof d.look==="object"){ const L=sanitizeLook(d.look); if(JSON.stringify(L)!==JSON.stringify(S.players[other()])){ S.players[other()]=L; save(); if(curScreen==="hub") redrawChars(); } }
  }
  if(screenNet) screenNet(path, NET.docs[path]);
  if(curScreen==="hub") hubNet(path);
}
function sanitizeLook(l){
  const n=(v,max)=>Number.isInteger(v)&&v>=0&&v<max?v:0;
  return {name:String(l.name||"").slice(0,12), skin:n(l.skin,SKINS.length), hair:n(l.hair,HAIRS.length), hairColor:n(l.hairColor,HAIRC.length), shirt:n(l.shirt,SHIRTS.length), build:n(l.build,BUILDS.length), acc:n(l.acc,ACCS.length)};
}
/* sessão compartilhada de cada jogo */

const POSE={
  idle:[[0,.12,-.15],[0,-.12,-.15]], walk:[[0,.1,-.2],[0,-.1,-.2]],
  happy:[[0,2.6,-.2],[0,-2.6,-.2]], wave:[[0,.12,-.15],[0,-2.5,-.5]],

function animChar(C, dt, t){
  C.t+=dt;
  if(C.swim||C.diving) return animSwim(C,dt);
  if(C.wasSwim){ C.wasSwim=false; const W=Math.PI*2; C.arms.forEach(a=>{ a.sho.rotation.x=((a.sho.rotation.x+Math.PI)%W+W)%W-Math.PI; }); C.head.rotation.y=0; C.body.rotation.z=0; }
  const P=POSE[C.walk>.05?"walk":C.pose]||POSE.idle, L=Math.min(1,dt*10);
  C.arms.forEach((a,i)=>{ const q=P[i];
    let tx=q[0], tz=q[1], te=q[2];
    if(C.walk>.05){ tx+=Math.sin(C.t*9+(i?Math.PI:0))*.55*C.walk; }
    if(C.pose==="wave"&&i===1) tz+=Math.sin(C.t*10)*.35;
    if(C.pose==="dance") { tz+=Math.sin(C.t*6+i*Math.PI)*.5; }
    if(C.pose==="reach"&&i===1) tx+=Math.sin(C.t*9)*.18;
    if(C.pose==="reel"){ tx+=Math.sin(C.t*14+i)*.12; }
    tz=-tz; a.sho.rotation.x+=(tx-a.sho.rotation.x)*L; a.sho.rotation.z+=(tz-a.sho.rotation.z)*L; a.elb.rotation.x+=(te-a.elb.rotation.x)*L;
  });
  C.legs.forEach((lg,i)=>{ let tx=C.walk>.05? Math.sin(C.t*9+(i?0:Math.PI))*.6*C.walk : 0; if(C.pose==="sit") tx=-1.45; lg.rotation.x+=(tx-lg.rotation.x)*L; });
  let by=Math.sin(C.t*2.2)*.008, lean=C.lean||0, rz=0;
  if(C.walk>.05) by=Math.abs(Math.sin(C.t*9))*.05;
  if(C.pose==="dance"){ by=Math.abs(Math.sin(C.t*6))*.08; rz=Math.sin(C.t*3)*.12; }
  if(C.pose==="happy") by=Math.abs(Math.sin(C.t*8))*.12;
  if(C.pose==="reach") lean=.32;
  if(C.pose==="sit") by=-.42;
  C.body.position.y+=(by-C.body.position.y)*Math.min(1,dt*14);
  C.body.rotation.x+=(lean-C.body.rotation.x)*L; C.body.rotation.z+=(rz-C.body.rotation.z)*L;
  C.head.rotation.x+=(((C.pose==="sad")?.25:(C.pose==="kiss"?.08:0))-C.head.rotation.x)*L;
}
function holdItem(C, e){ if(C.hold){ C.arms[1].hand.remove(C.hold); C.hold=null; } if(e){ const s=emojiSprite(e,.32); s.position.set(0,-.12,.12); C.arms[1].hand.add(s); C.hold=s; } }

        _o=vec3(instanceMatrix[3][0],0.0,instanceMatrix[3][2]);
      #endif
      vec3 _w=(modelMatrix*vec4(transformed,1.0)).xyz+_o;
      float _h=max(0.0,transformed.y-${base.toFixed(2)});
      transformed.x+=sin(uWind*1.7+_w.x*.32+_w.z*.21)*_h*${amp.toFixed(3)};
      transformed.z+=cos(uWind*1.3+_w.x*.17-_w.z*.29)*_h*${(amp*.6).toFixed(3)};`); };

const SBUF={};

const IN3={x:200,z:0,w:7,d:5};

const IN_BLOCK=[[IN3.x-1.75,IN3.x+1.75,IN3.z+1.15,IN3.z+2.4],[IN3.x-.85,IN3.x+.85,IN3.z-.35,IN3.z+.45],[IN3.x-2.0,IN3.x+2.0,IN3.z-5,IN3.z-4.05],[IN3.x+5.4,IN3.x+7,IN3.z-3.4,IN3.z+.2]];
function clampIn(x,z){

  return {x,z};

function inPath(cur,q){ // contorna o sofá/mesa pela lateral

/* =================== LAGO: ÁGUA, NADAR, PESCA =================== */
const lakeR=(x,z)=>Math.hypot((x-LAKE3.x)/LAKE3.rx,(z-LAKE3.z)/LAKE3.rz);
const lakeAng=(x,z)=>Math.atan2((z-LAKE3.z)/LAKE3.rz,(x-LAKE3.x)/LAKE3.rx);
const lakePt=(a,r)=>({x:LAKE3.x+Math.cos(a)*LAKE3.rx*r, z:LAKE3.z+Math.sin(a)*LAKE3.rz*r});
const onDock=(x,z)=>x>DOCK3.x-.5 && x<DOCK3.x+DOCK_LEN+.15 && Math.abs(z-DOCK3.z)<.62;
const inWater=(x,z)=>lakeR(x,z)<.93 && !onDock(x,z);

/* ---------- água realista (shader) ---------- */
function waterMaterial(cx=LAKE3.x,cz=LAKE3.z,rx=LAKE3.rx,rz=LAKE3.rz,sc=1){
  const U=THREE.UniformsUtils.merge([THREE.UniformsLib.fog,{
    uT:{value:0}, uC:{value:new THREE.Vector2(cx,cz)}, uR:{value:new THREE.Vector2(rx,rz)}, uS:{value:sc},
    uSun:{value:new THREE.Vector3(18,30,14).normalize()}, uRip:{value:Array.from({length:8},()=>new THREE.Vector4(0,0,-99,0))} }]);
  return new THREE.ShaderMaterial({ uniforms:U, transparent:true, depthWrite:false, fog:true,
    vertexShader:`varying vec3 vW;
      #include <fog_pars_vertex>
      void main(){ vec4 wp=modelMatrix*vec4(position,1.); vW=wp.xyz; vec4 mvPosition=viewMatrix*wp; gl_Position=projectionMatrix*mvPosition;
      #include <fog_vertex>
      }`,
    fragmentShader:`uniform float uT; uniform float uS; uniform vec2 uC; uniform vec2 uR; uniform vec3 uSun; uniform vec4 uRip[8]; varying vec3 vW;
      #include <fog_pars_fragment>
      float hs(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      float ns(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(hs(i),hs(i+vec2(1.,0.)),f.x),mix(hs(i+vec2(0.,1.)),hs(i+vec2(1.,1.)),f.x),f.y); }
      float rip(vec2 p){ float h=0.; for(int k=0;k<8;k++){ vec4 r=uRip[k]; float age=uT-r.z; if(age>0. && age<3.2){ float d=length(p-r.xy*uS), ring=age*1.9; h+=r.w*sin((d-ring)*10.)*exp(-abs(d-ring)*2.6)*(1.-age/3.2); } } return h; }
      float hgt(vec2 p){ float h=sin(dot(p,vec2(.9,.4))*1.25+uT*1.3)*.45+sin(dot(p,vec2(-.55,.83))*1.9+uT*1.7)*.28
          +ns(p*1.5+vec2(uT*.32,uT*.18))*.7+ns(p*3.6-vec2(uT*.45,-uT*.3))*.28; return h+rip(p)*2.2; }
      void main(){
        vec2 q=(vW.xz-uC)/uR; float r=length(q); vec2 p=vW.xz*uS; float e=.05;
        float h0=hgt(p), hx=hgt(p+vec2(e,0.)), hz=hgt(p+vec2(0.,e));
        vec3 n=normalize(vec3(-(hx-h0)/e*.1,1.,-(hz-h0)/e*.1));
        vec3 v=normalize(cameraPosition-vW);
        float dp=smoothstep(.98,.3,r);
        vec3 col=mix(vec3(.47,.83,.80),vec3(.10,.38,.56),dp);
        float ca=ns(p*2.3+uT*.55)*ns(p*3.1-uT*.45); col+=(1.-dp)*ca*.32;
        float fr=pow(1.-max(dot(n,v),0.),4.);
        col=mix(col,vec3(.86,.9,.98),clamp(fr*.8+.06,0.,1.));
        vec3 hv=normalize(normalize(uSun)+v); float nh=max(dot(n,hv),0.);
        col+=vec3(1.,.95,.82)*(pow(nh,160.)*2.4+step(.982,ns(p*8.5+uT*1.4))*pow(nh,14.)*.7);
        float fn=ns(p*3.2+uT*.7);
        float foam=smoothstep(.88,.975,r+(fn-.5)*.07+sin(uT*1.5+atan(q.y,q.x)*7.)*.01);
        float rf=clamp(rip(p)*1.3-.25,0.,1.);
        col=mix(col,vec3(1.),max(foam*.8,rf*.55));
        float a=mix(.6,.94,dp); a=max(a,foam*.92); a*=1.-smoothstep(.988,1.,r);
        gl_FragColor=vec4(col,a);
        #include <fog_fragment>
      }` });
}
function rippleIn(m,x,z,amp){ if(!m||!m.uniforms) return; const a=m.uniforms.uRip.value; m.userData.ri=((m.userData.ri||0)+1)%8; a[m.userData.ri].set(x,z,W3.t,amp); }
function rippleW(x,z,amp=.3){ if(W3&&W3.water) rippleIn(W3.water.material,x,z,amp); }
/* respingos */

    m.userData.v=V3(Math.cos(a)*s,(2.2+Math.random()*2.4)*pw,Math.sin(a)*s); m.userData.life=.55+Math.random()*.4; m.scale.setScalar(.6+Math.random()*1.1*pw);

/* ---------- construção do lago ---------- */
function buildLake(sc){
  W3.rip=null; W3.ripI=0; W3.fx=[]; W3.fishSil=[]; W3.jumpers=[];
  const lk=grp(LAKE3.x,0,LAKE3.z);
  const ring=mesh(new THREE.RingGeometry(.9,1,96,1),MT("#e9d6a8"),0,.03,0,false); ring.rotation.x=-Math.PI/2; ring.scale.set(LAKE3.rx+1.1,LAKE3.rz+1.1,1); ring.userData.ground=true; lk.add(ring);
  const wm=waterMaterial(); W3.rip=wm.uniforms.uRip.value;
  const water=new THREE.Mesh(new THREE.CircleGeometry(1,128),wm); water.position.y=.06; water.rotation.x=-Math.PI/2; water.scale.set(LAKE3.rx,LAKE3.rz,1); water.userData.hit="lake"; water.renderOrder=2; lk.add(water); W3.water=water;
  // vitórias-régias
  const rr2=rng(31), dA=lakeAng(DOCK3.x,DOCK3.z);
  for(let k=0;k<14;k++){ let a=rr2()*6.28; if(Math.abs(((a-dA+9.42)%6.28)-3.14)<.45) a+=.9; const d=.45+rr2()*.42, px=Math.cos(a)*LAKE3.rx*d, pz=Math.sin(a)*LAKE3.rz*d, rs=.3+rr2()*.2;
    const pad=mesh(new THREE.CylinderGeometry(rs,rs,.025,16,1,false,.35,5.93),MT(k%3?"#4f9a41":"#5daa4a"),px,.085,pz,false); pad.rotation.y=rr2()*6.28; lk.add(pad);
    if(k%3===0){ const fl=grp(px,.1,pz); for(let j=0;j<6;j++){ const pt=mesh(new THREE.SphereGeometry(.07,8,6),MT(j%2?"#ffc2d6":"#ff9fc0"),Math.cos(j)*.07,.04,Math.sin(j)*.07,false); pt.scale.set(.6,1.3,.6); pt.rotation.set(Math.sin(j)*.5,0,Math.cos(j)*.5); fl.add(pt); } fl.add(mesh(new THREE.SphereGeometry(.035,6,4),MT("#ffd34d"),0,.07,0,false)); lk.add(fl); } }
  sc.add(lk);
  // taboas e pedras na margem
  const rt=rng(57), reedM=MT("#5f8f3a"), tipM=MT("#7a4a2a"), rockM=MT("#a9a39a");
  [-.2,.5,1.15,1.85,2.35,-.95,-1.6,-2.3,3.8].forEach((a,k)=>{ for(let j=0;j<6;j++){ const q=lakePt(a+(rt()-.5)*.14,.95+rt()*.09), h=.8+rt()*.7;
      const s=mesh(new THREE.CylinderGeometry(.018,.025,h,5),reedM,q.x,h/2,q.z,false); s.rotation.set((rt()-.5)*.2,0,(rt()-.5)*.2); sc.add(s);
      if(j%2===0) sc.add(mesh(new THREE.CapsuleGeometry(.045,.16,3,6),tipM,q.x,h-.05,q.z,false));
      if(j%3===1){ const lf=mesh(new THREE.ConeGeometry(.04,h*1.1,3),reedM,q.x+.08,h*.5,q.z,false); lf.rotation.z=.25; sc.add(lf); } }
    if(k%2===0){ const q=lakePt(a+.3,1.06+rt()*.05), rk=mesh(new THREE.DodecahedronGeometry(.28+rt()*.25,0),rockM,q.x,.08,q.z); rk.scale.y=.55; rk.rotation.y=rt()*3; sc.add(rk); } });
  // peixinhos (sombras debaixo d'água)
  for(let k=0;k<8;k++){ const g=grp(); const b=new THREE.Mesh(new THREE.SphereGeometry(.2,10,6),new THREE.MeshBasicMaterial({color:"#1d3d50",transparent:true,opacity:.45,depthWrite:false})); b.scale.set(.55,.25,1.3); g.add(b);
    const tl=new THREE.Mesh(new THREE.ConeGeometry(.12,.22,3),b.material); tl.rotation.x=-Math.PI/2; tl.position.z=-.32; tl.scale.y=.3; g.add(tl);
    const q=lakePt(rt()*6.28,.2+rt()*.6); g.position.set(q.x,-.22,q.z); const s=.6+rt()*.8; g.scale.setScalar(s); sc.add(g); W3.fishSil.push({g,tl,tx:q.x,tz:q.z,w:0,ph:rt()*6}); }
  // píer comprido + balde + plaquinha
  const dock=grp(DOCK3.x,0,DOCK3.z), wood=MT("#c8935f"), dark=MT("#8a5a3b");
  for(let k=0;k<10;k++){ const pl=mesh(new THREE.BoxGeometry(.44,.1,1.3),k%2?wood:MT("#c08a57"),k*.48,.33,0); dock.add(pl); }
  [0,2.3,4.4].forEach(x=>[-.6,.6].forEach(z=>dock.add(mesh(new THREE.CylinderGeometry(.07,.08,1.4,6),dark,x,-.2,z))));
  [-.6,.6].forEach(z=>{ const r=mesh(new THREE.BoxGeometry(DOCK_LEN,.05,.05),dark,DOCK_LEN/2,.42,z); dock.add(r); });
  const bk=grp(DOCK_LEN-.15,.38,-.52); bk.add(mesh(new THREE.CylinderGeometry(.16,.12,.26,12),MT("#4a9bff"),0,.13,0)); bk.add(mesh(new THREE.TorusGeometry(.15,.012,4,16,Math.PI),MT("#c9ced6"),0,.3,0,false)); dock.add(bk);
  const sign=grp(-.35,0,-.85); sign.add(mesh(new THREE.CylinderGeometry(.04,.04,1.3,6),dark,0,.65,0)); const sp=mesh(new THREE.PlaneGeometry(1.2,.36),new THREE.MeshBasicMaterial({map:textTex("Pesca",512,150,"#fff8ee","#3a2a33","#4a9bff",78),transparent:true,side:THREE.DoubleSide}),0,1.3,0,false); sp.rotation.y=-Math.PI/2; sign.add(sp); dock.add(sign);
  dock.traverse(o=>o.userData.hit="dock"); sc.add(dock);
}

/* ---------- animação de nado ---------- */
function animSwim(C,dt){
  const mv=C.walk>.05 && !C.diving, L=Math.min(1,dt*6), W=Math.PI*2;
  C.wasSwim=true; const prev=C.swimPh||0; C.swimPh=prev+dt*(mv?4.4:2.6); const ph=C.swimPh;
  if(C.diving){ C.arms.forEach((a,i)=>{ a.sho.rotation.x+=(-2.9-a.sho.rotation.x)*L; a.sho.rotation.z+=((i?.15:-.15)-a.sho.rotation.z)*L; a.elb.rotation.x+=(0-a.elb.rotation.x)*L; });
    C.legs.forEach(lg=>{ lg.rotation.x+=(.15-lg.rotation.x)*L; }); C.body.rotation.x+=(1.35-C.body.rotation.x)*Math.min(1,dt*5); C.head.rotation.x+=(-.4-C.head.rotation.x)*L; return; }
  if(mv){
    C.arms.forEach((a,i)=>{ const off=i?Math.PI:0; a.sho.rotation.x=ph+off; a.sho.rotation.z+=((i?.18:-.18)-a.sho.rotation.z)*L; const rec=Math.sin(ph+off); a.elb.rotation.x=rec>0?-.75*rec:-.12;
      const ent=Math.floor((ph+off-Math.PI)/W)!==Math.floor((prev+off-Math.PI)/W); if(ent) C.stroke=i+1; });
    C.legs.forEach((lg,i)=>{ lg.rotation.x=Math.sin(ph*2.4+(i?Math.PI:0))*.38; });
    C.body.rotation.x+=(1.25-C.body.rotation.x)*Math.min(1,dt*4); C.body.rotation.z=Math.sin(ph)*.16; C.body.position.y=Math.sin(ph*2)*.03;
    C.head.rotation.x+=(-.85-C.head.rotation.x)*L; C.head.rotation.y=Math.sin(ph)*.35;
  } else {
    C.arms.forEach((a,i)=>{ a.sho.rotation.x=((a.sho.rotation.x+Math.PI)%W+W)%W-Math.PI; a.sho.rotation.x+=(Math.sin(ph*2+i*1.3)*.35-a.sho.rotation.x)*L;
      a.sho.rotation.z+=((i?1:-1)*(1.2+Math.sin(ph*2+i)*.25)-a.sho.rotation.z)*L; a.elb.rotation.x+=(-.35-a.elb.rotation.x)*L; });
    C.legs.forEach((lg,i)=>{ lg.rotation.x+=(Math.sin(ph*1.6+(i?Math.PI:0))*.45-lg.rotation.x)*L; });
    C.body.rotation.x+=(.12-C.body.rotation.x)*Math.min(1,dt*4); C.body.rotation.z+=(0-C.body.rotation.z)*L; C.body.position.y=Math.sin(ph*1.5)*.04;
    C.head.rotation.x+=(0-C.head.rotation.x)*L; C.head.rotation.y+=(0-C.head.rotation.y)*L;
  }
}
function charAnimTick(C,i,dt){
  const p=C.root.position;
  if(C.anim){ const A=C.anim; A.t+=dt; const k=Math.min(1,A.t/A.dur);
    p.x=A.from.x+(A.to.x-A.from.x)*k; p.z=A.from.z+(A.to.z-A.from.z)*k; p.y=A.from.y+(A.to.y-A.from.y)*k+Math.sin(Math.PI*k)*A.h;
    C.targetYaw=Math.atan2(A.to.x-A.from.x,A.to.z-A.from.z); C.walk=0;
    if(k>=1){ C.anim=null; if(A.cb) A.cb(); if(C.queue){ const q=C.queue; C.queue=null; walkW(...q); } }
    return true; }
  if(!C.seated){ const ty=C.sofa?.2:C.swim?(C.walk>.05?-.5:-1.28):(onDock(p.x,p.z)?.38:0); p.y+=(ty-p.y)*Math.min(1,dt*(C.swim?3:12)); }
  return false;
}
function diveIn(i,from,to,cb){
  const C=W3.chars[i]; C.path=[]; C.diving=true; C.pose="idle"; setFace(C,"happy");
  if(i===actor()||lakeR(C.root.position.x,C.root.position.z)<2) snd("jump");
  C.anim={t:0,dur:.8,h:from.y>.2?1.1:.9,from:{x:from.x,y:C.root.position.y,z:from.z},to:{x:to.x,y:-1.0,z:to.z},cb:()=>{
    C.diving=false; C.swim=true; splashW(to.x,to.z,22,1.3); rippleW(to.x,to.z,.6); snd("dive"); if(cb) cb(); }};
}
function climbOut(i,to,cb){
  const C=W3.chars[i], p=C.root.position; C.swim=false; C.path=[]; splashW(p.x,p.z,8,.7); rippleW(p.x,p.z,.4);
  C.anim={t:0,dur:.65,h:.7,from:{x:p.x,y:p.y,z:p.z},to:{x:to.x,y:onDock(to.x,to.z)?.38:0,z:to.z},cb:()=>{ snd("swimout"); for(let k=0;k<5;k++) setTimeout(()=>{ const q=C.root.position; splashW(q.x,q.z,2,.25,1.0,"#bfe6ff"); },k*160); if(cb) cb(); }};
}

      b.x+=(tx+(V.thrash?(Math.random()-.5)*.12:0)-b.x)*Math.min(1,dt*6); b.z+=(tz-b.z)*Math.min(1,dt*6);

}
function newCastPoint(i){ for(let k=0;k<20;k++){ const x=FISHSPOT(i).x+2.4+Math.random()*3.6, z=DOCK3.z+(Math.random()-.5)*5; if(lakeR(x,z)<.82) return {x,z}; } return {x:FISHSPOT(i).x+3,z:DOCK3.z}; }

/* ---------- retratos 3D (usados nas telas dos jogos) ---------- */
const PORT={cache:{}, R:null};
const PORT_POSE={idle:"idle",happy:"happy",wave:"wave",think:"think",sad:"sad",kiss:"kiss",hug:"hug",dance:"dance",sign:"sign",give:"give",reach:"reach",eat:"idle"};
const PORT_FACE={idle:"idle",happy:"happy",wave:"happy",think:"think",sad:"sad",kiss:"kiss",hug:"hug",dance:"dance",sign:"idle",give:"happy",reach:"happy",eat:"idle"};
function poseInstant(C,name){
  const P=POSE[name]||POSE.idle;
  C.arms.forEach((a,i)=>{ a.sho.rotation.set(P[i][0],0,-P[i][1]); a.elb.rotation.set(P[i][2],0,0); });
  C.legs.forEach(l=>l.rotation.set(0,0,0));
  C.body.rotation.set(name==="reach"?.25:0,0,name==="dance"?.1:0); C.body.position.y=name==="happy"?.04:0;
  C.head.rotation.set(name==="sad"?.22:(name==="think"?-.12:0), name==="think"?.25:0, 0);
}
function portrait(p, mood, o={}){
  const head=!!o.vb, key=JSON.stringify([p.skin,p.hair,p.hairColor,p.shirt,p.build,p.acc,mood,head,!!o.crown,o.sign||"",!!o.revealed,o.hold||""]);
  if(PORT.cache[key]) return PORT.cache[key];
  if(!PORT.R){ const R=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true}); R.setPixelRatio(1); R.setClearColor(0x000000,0); if(GFX2){ R.outputEncoding=THREE.sRGBEncoding; R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=1.1; }
    const sc=new THREE.Scene(); sc.add(new THREE.HemisphereLight("#fff0e0","#9a8a80",GFX2?.9:.5)); const d=new THREE.DirectionalLight("#fff3e0",GFX2?1.3:.62); d.position.set(2.5,4,6); sc.add(d); const d2=new THREE.DirectionalLight("#ffd6e0",.18); d2.position.set(-4,2,2); sc.add(d2);
    PORT.R=R; PORT.sc=sc; PORT.cam=new THREE.PerspectiveCamera(30,.5,.1,60); }
  const R=PORT.R, cam=PORT.cam, W=head?192:256, H=head?192:512; R.setSize(W,H,false);
  const C=buildChar(p); setFace(C, PORT_FACE[mood]||"idle"); poseInstant(C, PORT_POSE[mood]||"idle");
  C.root.rotation.y=head?0:.28;
  if(mood==="sign"){ const tx=textTex((o.sign||"?????").toUpperCase(),512,256,"#fffaf2",o.revealed?"#3aa394":"#6e5764","#c9b3bf",(o.sign||"?????").length>5?78:110);
    const bd=new THREE.Mesh(new THREE.PlaneGeometry(.95,.48),new THREE.MeshBasicMaterial({map:tx,transparent:true})); bd.position.set(0,1.12,.42); C.body.add(bd); }
  if(o.crown){ const cr=grp(0,.3,0); const ring=mesh(new THREE.CylinderGeometry(.17,.19,.14,10,1,true),MT("#ffcc33",{side:THREE.DoubleSide}),0,0,0,false); cr.add(ring);
    for(let k=0;k<5;k++){ const a=k/5*Math.PI*2; cr.add(mesh(new THREE.ConeGeometry(.04,.12,4),MT("#ffcc33"),Math.cos(a)*.17,.12,Math.sin(a)*.17,false)); } cr.add(mesh(new THREE.SphereGeometry(.035,8,6),MT("#ff7a93"),0,.06,.19,false)); C.head.add(cr); }
  if(o.hold) holdItem(C,o.hold);
  PORT.sc.add(C.root);
  if(head){ cam.aspect=1; cam.fov=26; cam.position.set(0,1.6,1.75); cam.lookAt(0,1.56,0); }
  else { cam.aspect=.5; cam.fov=30; cam.position.set(0,1.12,5.3); cam.lookAt(0,1.08,0); }
  cam.updateProjectionMatrix(); R.render(PORT.sc,cam);
  const url=R.domElement.toDataURL("image/png");
  PORT.sc.remove(C.root); C.root.traverse(m=>{ if(m.geometry) m.geometry.dispose(); });
  PORT.cache[key]=url; return url;
}

function evaluate(g, a){
  const res=Array(5).fill("absent"), left={};
  for(let i=0;i<5;i++){ if(g[i]===a[i]) res[i]="correct"; else left[a[i]]=(left[a[i]]||0)+1; }
  for(let i=0;i<5;i++){ if(res[i]!=="correct" && left[g[i]]>0){ res[i]="present"; left[g[i]]--; } }
  return res;
}
const EMO={correct:"🟩",present:"🟨",absent:"⬛"};
const WIN_MSG=["Lendário! 🤯","Impressionante! ✨","Arrasou! 💪","Mandou bem! 😎","Boa! 👏","Ufa! No limite! 😮‍💨"];

/* duel: {seed} → os dois jogam a mesma palavra ao vivo */
function play({player, answer, chooser, onDone, onQuit, duel}){
  const L=makeLine(); const rows=[]; let busy=false, done=false; const kstate={};
  const left = 0, right = 1;
  const root=render(`
    ${topbar(duel?"Duelo de Termo ⚔️":`${nm(player)} adivinha`, false)}
    <div class="stage">
      ${slot(0)}
      <div class="turn">${duel?`<span id="pstat">${nm(chooser)}</span><div class="mini" id="mini"></div>`:`vez de<b>${nm(player)}</b>`}</div>
      ${slot(1)}
    </div>
    <div class="boardWrap"><div class="board" id="board"></div></div>
    ${kbHTML()}`,"play");
  function slot(i){
    const cls=(i===0?"left":"right")+(i===player?" active":"");
    if(i===player) return av(i,"think",{cls});
    return duel? av(i,"think",{cls}) : av(i,"sign",{sign:"?????",cls});
  }
  const board=root.querySelector("#board");
  bindTop(root, ()=>{
    if(done) return (onQuit||hub)();
    confirmBox("Sair da partida?","O progresso dessa palavra vai ser perdido.","Sair",()=>(onQuit||hub)());
  });
  function drawBoard(){
    let h="";
    for(let r=0;r<6;r++){
      if(r<rows.length){ const {g,res}=rows[r]; const d=[...disp(g)];
        h+=`<div class="brow">${res.map((s,i)=>`<div class="tile ${s}">${d[i]}</div>`).join("")}</div>`; }
      else if(r===rows.length && !done) h+=lineHTML(L,false);
      else h+=`<div class="brow future">${"<div class='tile'></div>".repeat(5)}</div>`;
    }
    board.innerHTML=h;
    const cur=board.querySelector(".brow.current");
    if(cur) cur.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{ if(busy) return; L.pos=+t.dataset.i; drawBoard(); });
  }
  function paintKeys(){ root.querySelectorAll(".key").forEach(b=>{ const s=kstate[b.dataset.k]; b.classList.remove("correct","present","absent"); if(s) b.classList.add(s); }); }
  drawBoard();
  // duelo: progresso do outro
  let partner=null;
  function drawPartner(){
    if(!duel) return;
    const mini=root.querySelector("#mini"), st=root.querySelector("#pstat"); if(!mini) return;
    const pr = partner && partner.seed===duel.seed ? partner : null;
    const prow = pr ? (pr.rows||[]) : [];
    let h=""; for(let r=0;r<6;r++){ const s=prow[r]||""; for(let c=0;c<5;c++) h+=`<i class="${s[c]||""}"></i>`; }
    mini.innerHTML=h;
    st.innerHTML = !pr ? `${nm(chooser)} <small>(esperando…)</small>` : pr.done ? `${nm(chooser)}: <b style="display:inline">${pr.solved?pr.tries+"/6":"X/6"}</b>` : `${nm(chooser)} <small>jogando…</small>`;
    const line=document.getElementById("partnerLine"); if(line) line.innerHTML=duelLine();
  }
  function duelLine(){
    const pr = partner && partner.seed===duel.seed ? partner : null;
    if(!pr || !pr.done) return `Esperando ${nm(chooser)} terminar… ⏳`;
    const me={solved:rows.length&&rows[rows.length-1].res.every(s=>s==="correct"), tries:rows.length, t:myDoneT};
    const a=me.solved?me.tries:7, b=pr.solved?pr.tries:7;
    let w = a<b?player: b<a?chooser : (a===7? -1 : (me.t<=pr.t?player:chooser));
    if(!duelCounted){ duelCounted=true; addWin("termo",w); if(w===player){ setMood(chooser,"sad"); } else if(w===chooser){ setMood(chooser,"happy",{crown:true}); } }
    return w===-1? `${nm(chooser)} também não acertou. Empate! 🤝` : w===player? `Você venceu ${nm(chooser)} (${b===7?"X":b}/6)! 🏆` : `${nm(chooser)} venceu com ${b}/6 😤`;
  }
  let duelCounted=false, myDoneT=0;
  if(duel){
    partner=NET.docs["jogos/termo-p"+chooser]; drawPartner();
    screenNet=(path,d)=>{ if(path==="jogos/termo-p"+chooser){ const was=partner; partner=d; drawPartner();
      if(d && d.seed===duel.seed && !done){ const n=(d.rows||[]).length, pn=was&&was.seed===duel.seed?(was.rows||[]).length:0;
        if(d.done && !(was&&was.done&&was.seed===duel.seed)) say(chooser, d.solved?`Acertei em ${d.tries}! 😎`:"Não acertei 😭",3000);
        else if(n>pn){ const g=(d.rows[n-1].match(/c/g)||[]).length; say(chooser, g>=3?"Tô quase! 🔥":g===0?"Errei feio 😅":"Hmm... 🤔",1800); } } } };
    pushDuel();
  } else setTimeout(()=>say(chooser, pick(["Duvido acertar 😏","Boa sorte, amor 😘","Essa é difícil hein 🤭","Pensa bem 🤔"])),400);
  function pushDuel(){ if(!duel) return; push("jogos/termo-p"+player,{seed:duel.seed, rows:rows.map(r=>r.res.map(s=>s[0]).join("")), done, solved: done&&rows.length&&rows[rows.length-1].res.every(s=>s==="correct"), tries:rows.length, t:myDoneT||Date.now()}); }

  function submit(){
    if(busy||done) return;
    const cur=board.querySelector(".brow.current");
    if(!L.full()){ toast("Só palavras com 5 letras"); shake(cur); return; }
    const g=L.word();
    if(!VSET.has(g)){ snd("bad"); toast("Essa palavra não é aceita"); shake(cur); say(player,"Ops 😅",1200); return; }
    busy=true;
    const res=evaluate(g,answer); const d=[...disp(g)];
    const tiles=cur.querySelectorAll(".tile");
    tiles.forEach((t,i)=>{ t.classList.remove("cursor");
      setTimeout(()=>{ t.classList.add("flip"); snd("flip"); setTimeout(()=>{ cur.classList.remove("current"); t.style.border="0"; t.textContent=d[i]; t.classList.add(res[i]); },250); }, i*260); });
    setTimeout(()=>{
      rows.push({g,res});
      const RK={absent:1,present:2,correct:3}; res.forEach((s,i)=>{ const k=g[i], p=kstate[k]; if(!p||RK[s]>RK[p]) kstate[k]=s; });
      paintKeys();
      const greens=res.filter(s=>s==="correct").length, hits=res.filter(s=>s!=="absent").length;
      const won=greens===5, lost=!won && rows.length===6;
      if(won||lost){ done=true; myDoneT=Date.now(); busy=false; drawBoard(); pushDuel(); snd(won?"win":"lose"); finish(won); return; }
      L.cells=["","","","",""]; L.pos=0; drawBoard(); busy=false; pushDuel();
      if(greens>=3){ setMood(player,"happy"); if(!duel) say(chooser,pick(["Tá quase! 🔥","Quente, quente! 🥵","Eita, chegando perto 😳"])); }
      else if(hits===0){ setMood(player,"sad"); if(!duel) say(chooser,pick(["Errou feio, errou rude 😂","Frio, gelado ❄️","Hahaha nada 🙃"])); }
      else if(!duel) say(chooser,pick(["Hmm... 🤔","Vai, você consegue!","Esquentando 👀","Nem perto... ou será? 😏"]));
      setTimeout(()=>{ if(!done) setMood(player,"think"); },1300);
    }, 5*260+300);
  }
  function finish(won){
    const tries=rows.length;
    const grid=rows.map(r=>r.res.map(s=>EMO[s]).join("")).join("\n");
    if(won){
      board.querySelectorAll(".brow")[tries-1].querySelectorAll(".tile").forEach((t,i)=>{ t.style.animationDelay=(i*90)+"ms"; t.classList.remove("flip"); t.classList.add("win"); });
      setMood(player,"happy");
      if(!duel){ setMood(chooser,"sign",{sign:disp(answer),revealed:true}); say(chooser, pick(["Aaah, acertou! 😤","Como assim?! 😱","Orgulho de você 🥹","Sorte de principiante 🙄"]),4000); }
    } else {
      setMood(player,"sad");
      if(!duel){ setMood(chooser,"sign",{sign:disp(answer),revealed:true}); say(chooser, pick(["Hehe, não foi dessa vez 😈","Ganhei essa! 😎","Era fácil, amor 🤭"]),4000); }
    }
    keyHandler=null;
    setTimeout(()=>{
      const card=document.createElement("div"); card.className="endCard";
      card.innerHTML=`<h2>${won?WIN_MSG[tries-1]:"Não foi dessa vez 😢"}</h2>
        <p>${won?`${nm(player)} acertou em ${tries}/6`:`A palavra era:`}</p>
        <div class="word">${[...disp(answer)].map(c=>`<span>${c}</span>`).join("")}</div>
        ${duel?`<p id="partnerLine" style="font-weight:600;color:#3a2a33">${duelLine()}</p>`:""}
        <button class="btn" id="cont">${duel?"Voltar pro parque 🏞️":"Continuar →"}</button>`;
      root.appendChild(card);
      card.querySelector("#cont").onclick=()=>onDone({solved:won,tries:won?tries:7,grid,answer});
    }, won?900:600);
  }
  bindKb(root,k=>{ if(done||busy) return; if(k==="enter") return submit(); if(L.key(k)) drawBoard(); });
}
