<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nosso Mundinho</title>
<script src="peerjs.min.js"></script><script src="mqtt.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#5b4654; --bg2:#33272f; --ink:#fff7f2; --muted:#dcc8d1;
  --correct:#3aa394; --present:#d9a54a; --absent:#2b2226;
  --future:#5a4552; --curBorder:#9b8292; --key:#8a7380; --accent:#ff7a93;
  --p0:#4a9bff; --p1:#ffc23d;
  --tile:min(14vw, 6.1dvh, 60px);
  --keyh:min(54px, 6.4dvh);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;margin:0;height:100%;color:var(--ink);font-family:'Fredoka',ui-rounded,system-ui,-apple-system,sans-serif;overscroll-behavior:none;overflow:hidden}
body{background:radial-gradient(130% 80% at 50% 0%,#735a69 0%,var(--bg1) 38%,var(--bg2) 100%) fixed;background-color:var(--bg2)}
button{font-family:inherit;color:inherit}
#app{height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;position:relative}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;animation:fadeIn .28s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 2px;min-height:50px;gap:8px}
.top h1{font-size:1.12rem;font-weight:600;margin:0;letter-spacing:.3px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;flex-shrink:0;border-radius:50%;border:0;background:rgba(255,255,255,.12);font-size:1.15rem;font-weight:700;display:grid;place-items:center;cursor:pointer}
.ibtn:active{background:rgba(255,255,255,.22)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px 18px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 16px;border-radius:16px;border:0;
  font:600 1.08rem 'Fredoka',ui-rounded,system-ui,sans-serif;background:var(--correct);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.28);cursor:pointer;text-decoration:none;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.alt{background:#7d6573}.btn.pink{background:var(--accent)}.btn.gold{background:var(--present)}.btn.wa{background:#25a35a}.btn.blue{background:#4a7bd6}
.btn.small{padding:10px 14px;font-size:.98rem;border-radius:12px;width:auto}
.btn:disabled{opacity:.5}
.stack{display:flex;flex-direction:column;gap:12px}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.92rem;cursor:pointer;padding:8px}

/* ---------- bonequinhos ---------- */
.avatar{position:relative;display:flex;flex-direction:column;align-items:center}
.avatar .fig{height:100%;aspect-ratio:100/150;transform-origin:50% 100%}
.avatar svg{width:100%;height:100%;overflow:visible;display:block}
.m-idle .fig{animation:bob 2.6s ease-in-out infinite}
.m-think .fig{animation:sway 2.2s ease-in-out infinite}
.m-happy .fig{animation:jump .55s ease-in-out infinite}
.m-sad .fig{animation:droop 1.6s ease-in-out infinite}
.m-sign .fig,.m-wave .fig{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}35%{transform:translateY(-16%) scale(.97,1.03)}70%{transform:translateY(0) scale(1.05,.95)}}
@keyframes droop{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(2px) scale(1.01,.98)}}
.eyes{animation:blink 4.2s infinite;transform-origin:50px 48px;transform-box:view-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.waveArm{animation:wave .7s ease-in-out infinite alternate;transform-origin:69px 82px;transform-box:view-box}
@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.shadow{width:60%;height:8px;border-radius:50%;background:rgba(0,0,0,.25);margin-top:-6px}
.avatar.active .shadow{background:rgba(255,214,120,.55);box-shadow:0 0 14px 4px rgba(255,214,120,.45)}
.bubble{position:absolute;bottom:92%;left:50%;transform:translateX(-50%) scale(.6);background:#fff;color:#3a2a33;font-weight:600;font-size:.86rem;
  padding:6px 10px;border-radius:14px;white-space:nowrap;opacity:0;pointer-events:none;transition:all .22s cubic-bezier(.3,1.6,.6,1);z-index:30;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.bubble:after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}
.bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
.avatar.left .bubble{left:62%}.avatar.right .bubble{left:38%}

/* ---------- parquinho ---------- */
.statusBar{display:flex;justify-content:center;padding:0 12px 6px}
.pill{background:rgba(0,0,0,.25);border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#9aa}
.dot.on{background:#4ade80;box-shadow:0 0 8px #4ade80}
.banner{margin:0 12px 8px;background:#fff7f2;color:#3a2a33;border-radius:14px;padding:8px 8px 8px 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:.92rem;animation:fadeIn .3s}
.banner span{flex:1}
.banner .btn{width:auto;padding:8px 12px;font-size:.9rem;border-radius:10px;box-shadow:none}
.banner .x{background:none;border:0;font-size:1.1rem;color:#9b8792;padding:4px 6px;cursor:pointer}
.scene{flex:1;position:relative;overflow:hidden;border-radius:24px;margin:0 10px;min-height:0;
  background:linear-gradient(180deg,#ffb8a2 0%,#ffd8a8 22%,#ffe9c2 33%,#9fd77a 33.2%,#86c962 60%,#6fb552 100%);touch-action:none;cursor:pointer;isolation:isolate}
.scene .deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:55%;height:160%;left:15%;top:-70%}.cloud:after{width:40%;height:130%;left:50%;top:-45%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.station{position:absolute;transform:translate(-50%,-100%);width:30%;cursor:pointer;z-index:2;transition:transform .15s}
.station:active{transform:translate(-50%,-100%) scale(.96)}
.station svg{width:100%;display:block;overflow:visible;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.station .who{position:absolute;left:50%;top:-14px;transform:translateX(-50%);display:flex;gap:2px}
.char{position:absolute;transform:translate(-50%,-100%);z-index:5;pointer-events:auto}
.char.left .fig svg{transform:scaleX(-1)}
.char .avatar{height:var(--ch,110px)}
.char.walking .fig{animation:walk .32s ease-in-out infinite !important}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6%) rotate(3deg)}}
.char .tag{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:2px;font-size:.78rem;font-weight:600;background:rgba(40,25,35,.55);padding:1px 8px;border-radius:999px;white-space:nowrap;color:#fff}
.char.ctrl .tag{background:#ff7a93}
.char .bubble{bottom:auto;top:-30px}
.marker{position:absolute;width:26px;height:12px;border-radius:50%;border:3px solid rgba(255,255,255,.85);transform:translate(-50%,-50%);pointer-events:none;animation:ping .6s ease-out forwards;z-index:1}
@keyframes ping{from{opacity:1;transform:translate(-50%,-50%) scale(.4)}to{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
.enterBtn{position:absolute;transform:translate(-50%,0);z-index:20;padding:8px 14px;border-radius:999px;border:0;background:#ff7a93;color:#fff;font:600 .95rem Fredoka,system-ui;box-shadow:0 3px 0 rgba(0,0,0,.25);animation:pop .3s;cursor:pointer;white-space:nowrap}
@keyframes pop{from{transform:translate(-50%,0) scale(.3);opacity:0}70%{transform:translate(-50%,0) scale(1.1)}to{transform:translate(-50%,0);opacity:1}}
.fly{position:absolute;font-size:1.4rem;pointer-events:none;animation:fly 1.4s ease-out forwards;z-index:40}
@keyframes fly{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),-140px) scale(1.3);opacity:0}}
.emotes{display:flex;gap:6px;padding:8px 10px 10px;align-items:center}
.emo{flex:1;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.13);font-size:1.35rem;cursor:pointer;padding:0}
.emo:active{background:rgba(255,255,255,.25);transform:scale(.94)}
.ctrlBar{display:flex;gap:6px;justify-content:center;padding:0 10px;font-size:.85rem;color:var(--muted);align-items:center}
.ctrlBar button{border:2px solid transparent;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 12px;font-weight:600;cursor:pointer}
.ctrlBar button.on{border-color:#ff7a93;background:rgba(255,122,147,.25);color:#fff}

/* ---------- termo ---------- */
.stage{display:flex;justify-content:space-between;align-items:flex-end;padding:0 10px;margin-top:22px;height:min(190px,19dvh);position:relative;flex-shrink:0}
.stage .avatar{height:100%}
.turn{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);text-align:center;font-size:.9rem;color:var(--muted);line-height:1.25}
.turn b{display:block;color:#fff;font-size:1.05rem}
.mini{display:grid;grid-template-columns:repeat(5,9px);gap:2px;justify-content:center;margin-top:4px}
.mini i{width:9px;height:9px;border-radius:2px;background:rgba(255,255,255,.12)}
.mini i.c{background:var(--correct)}.mini i.p{background:var(--present)}.mini i.a{background:#221a1e}
.boardWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.board{display:grid;grid-template-rows:repeat(6,var(--tile));gap:6px}
.brow{display:grid;grid-template-columns:repeat(5,var(--tile));gap:6px}
.tile{width:var(--tile);height:var(--tile);border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:calc(var(--tile)*.56);text-transform:uppercase;line-height:1}
.brow.future .tile{background:var(--future)}
.brow.current .tile{border:4px solid var(--curBorder);cursor:pointer}
.brow.current .tile.cursor{border-bottom-width:10px}
.brow.current .tile.filled{animation:tap .12s}
@keyframes tap{50%{transform:scale(1.08)}}
.tile.correct{background:var(--correct)}.tile.present{background:var(--present)}.tile.absent{background:var(--absent)}
.tile.flip{animation:flip .5s ease both}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.tile.win{animation:hop .5s ease both}
@keyframes hop{40%{transform:translateY(-34%)}70%{transform:translateY(6%)}}
.brow.shake,.shakeIt{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.kb{padding:6px 5px 8px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.kr{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:46px;height:var(--keyh);border:0;border-radius:8px;background:var(--key);font-weight:600;font-size:1.2rem;text-transform:uppercase;display:grid;place-items:center;cursor:pointer;padding:0}
.key:active{filter:brightness(1.25)}
.key.wide{max-width:none;flex:1.9;font-size:.92rem;letter-spacing:.5px}
.key.bk{max-width:none;flex:1.25}
.key.correct{background:var(--correct)}.key.present{background:var(--present)}.key.absent{background:#3a2f34;color:#8f7f87}
.pickBox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0;padding:0 16px}
.pickBox .avatar{height:min(150px,19dvh)}
.ptitle{font-size:1.22rem;font-weight:600;text-align:center;margin:0}
.psub{color:var(--muted);text-align:center;margin:0;font-size:.98rem}
.pickTiles .brow.current .tile{border-color:#c7aebd}
.tools{display:flex;gap:8px;justify-content:center}
.tools .btn{white-space:nowrap;padding:10px 12px;font-size:.95rem}
.endCard{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:#fff7f2;color:#3a2a33;border-radius:22px;padding:16px 16px 14px;
  box-shadow:0 10px 40px rgba(0,0,0,.45);animation:up .35s cubic-bezier(.3,1.4,.6,1);z-index:50}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.endCard h2{margin:0 0 4px;text-align:center;font-size:1.45rem}
.endCard p{margin:0 0 12px;text-align:center;color:#6f5a66}
.word{display:flex;gap:5px;justify-content:center;margin:6px 0 12px}
.word span{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:1.3rem;text-transform:uppercase;color:#fff;background:var(--correct)}
.resStage{display:flex;justify-content:center;align-items:flex-end;gap:18px;height:min(190px,24dvh);margin:22px 0 10px}
.resStage .avatar{height:100%}
.cards{display:flex;gap:10px;margin-bottom:14px}
.pcard{flex:1;background:rgba(0,0,0,.2);border-radius:16px;padding:12px;text-align:center}
.pcard .who{font-weight:600}
.pcard .tries{font-size:1.6rem;font-weight:700;margin:2px 0}
.pcard .grid{font-size:.8rem;line-height:1.05;letter-spacing:-1px;margin:6px 0}
.pcard .w{font-size:.85rem;color:var(--muted)}
.big{font-size:1.55rem;font-weight:700;text-align:center;margin:4px 0 2px}
.mid{text-align:center;color:var(--muted);margin:0 0 14px}
.preview{height:min(190px,24dvh);display:flex;justify-content:center;margin:34px 0 8px}
.preview .avatar{height:100%}
label.lb{display:block;font-weight:600;margin:14px 0 8px;font-size:.98rem;color:#ffe3ea}
input.txt{width:100%;font:600 18px 'Fredoka',ui-rounded,system-ui,sans-serif;padding:12px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.18);background:rgba(0,0,0,.2);color:#fff;outline:none;user-select:text;-webkit-user-select:text}
input.txt:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid transparent;border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.12);font-weight:600;cursor:pointer;font-size:.95rem}
.chip.dot{width:38px;height:38px;padding:0}
.chip.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.codeTiles{display:flex;gap:6px;justify-content:center;margin:10px 0}
.codeTiles span{width:52px;height:56px;border-radius:12px;background:var(--present);display:grid;place-items:center;font-size:1.9rem;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.msgBox{background:rgba(0,0,0,.22);border-radius:14px;padding:12px 14px;white-space:pre-wrap;font-size:.95rem;line-height:1.35;margin-bottom:14px;user-select:text;-webkit-user-select:text}
textarea.copyFallback{width:100%;height:110px;border-radius:12px;padding:10px;font:500 15px 'Fredoka',system-ui;background:#fff;color:#222;border:0;margin-top:8px;user-select:text;-webkit-user-select:text}

/* ---------- bingo ---------- */
.caller{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 12px 10px;flex-shrink:0}
.ballBig{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff 0 18%,var(--bc,#ff7a93) 19%);box-shadow:inset -6px -8px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.3);flex-shrink:0}
.ballBig .in{width:54px;height:54px;border-radius:50%;background:#fff;color:#3a2a33;display:grid;place-items:center;line-height:1;text-align:center;font-weight:700}
.ballBig .in small{display:block;font-size:.8rem;color:var(--bc)}
.ballBig .in b{font-size:1.45rem}
.ballBig.pop{animation:ballpop .45s cubic-bezier(.3,1.6,.6,1)}
@keyframes ballpop{from{transform:scale(.3) rotate(-90deg)}to{transform:none}}
.hist{display:flex;flex-wrap:wrap;gap:5px;max-width:190px}
.hist span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:#fff;opacity:.9}
.callerInfo{font-size:.85rem;color:var(--muted);text-align:center}
.cardsArea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0;padding:0 10px 10px;overflow:auto}
.bcards{display:flex;gap:10px;justify-content:center;width:100%}
.bcard{background:#fff7f2;border-radius:16px;padding:8px;color:#3a2a33;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.bcard .hd{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px;font-weight:700}
.bcard .hd .nm{font-size:.95rem;display:flex;align-items:center;gap:6px}
.bgrid{display:grid;grid-template-columns:repeat(5,var(--bc-s));gap:4px}
.bgrid .h{height:calc(var(--bc-s)*.7);display:grid;place-items:center;font-weight:700;color:#fff;border-radius:6px;font-size:calc(var(--bc-s)*.42)}
.bcell{width:var(--bc-s);height:var(--bc-s);border-radius:8px;background:#efe3e8;display:grid;place-items:center;font-weight:700;font-size:calc(var(--bc-s)*.4);cursor:pointer;position:relative}
.bcell.free{background:#ffd6de;font-size:calc(var(--bc-s)*.45)}
.bcell.mk{color:#fff}
.bcell.mk:after{content:"";position:absolute;inset:12%;border-radius:50%;border:3px solid rgba(255,255,255,.75)}
.bcell.win{animation:hop .5s ease both}
.headDot{width:26px;height:26px;border-radius:50%;overflow:hidden;background:rgba(0,0,0,.08);flex-shrink:0}
.headDot svg{width:100%;height:auto;transform:scale(2.1) translateY(14%)}
.bingoBtn{width:100%;margin-top:8px;padding:10px;border-radius:12px;border:0;font:700 1.1rem Fredoka,system-ui;color:#fff;background:#ff7a93;box-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer;letter-spacing:1px}
.bingoBtn:active{transform:translateY(2px);box-shadow:none}
.waitNote{font-size:.85rem;color:var(--muted);text-align:center}

/* ---------- caça-palavras ---------- */
.cacaHead{display:flex;align-items:flex-end;justify-content:space-between;padding:0 14px;height:min(130px,14dvh);margin-top:16px;flex-shrink:0;position:relative}
.cacaHead .avatar{height:100%}
.cacaHead .sc{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);text-align:center;font-weight:700;font-size:1.5rem}
.cacaHead .sc small{display:block;font-size:.85rem;color:var(--muted);font-weight:600}
.words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px 12px;flex-shrink:0}
.words span{padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:600;font-size:.88rem;letter-spacing:.5px}
.words span.got{text-decoration:line-through;color:#3a2a33}
.gridWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 10px 12px}
.cgrid{position:relative;display:grid;grid-template-columns:repeat(10,var(--cs));background:#fff7f2;border-radius:16px;padding:6px;box-shadow:0 5px 0 rgba(0,0,0,.25);touch-action:none}
.cgrid .cl{width:var(--cs);height:var(--cs);display:grid;place-items:center;font-weight:700;color:#3a2a33;font-size:calc(var(--cs)*.52);position:relative;z-index:2}
.cgrid svg{position:absolute;left:6px;top:6px;pointer-events:none;z-index:1}
.turnTag{font-size:.9rem;color:var(--muted);text-align:center;flex-shrink:0}

/* ---------- modal / toast ---------- */
.modalBg{position:fixed;inset:0;background:rgba(20,12,18,.6);display:flex;align-items:flex-end;justify-content:center;z-index:80;padding:14px;animation:fadeIn .2s}
.modal{background:#fff7f2;color:#3a2a33;border-radius:24px;padding:20px 18px calc(18px + env(safe-area-inset-bottom));max-width:480px;width:100%;max-height:88dvh;overflow:auto}
.modal h2{margin:0 0 10px;font-size:1.35rem}
.modal p{margin:8px 0;line-height:1.4;color:#5a4652}
.modal .btn.alt{background:#a28d98}
.ex{display:flex;gap:4px;margin:10px 0 2px}
.ex span{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;font-weight:700;color:#fff;background:#b7a6b0;text-transform:uppercase}
.whoPick{display:flex;justify-content:center;gap:16px;height:150px;margin:6px 0 10px}
.whoPick .opt{height:100%;display:flex;flex-direction:column;align-items:center;border-radius:18px;padding:6px 8px 4px;border:3px solid transparent;cursor:pointer;background:#f1e6eb}
.whoPick .opt.on{border-color:#ff7a93;background:#ffe3ea}
.whoPick .avatar{flex:1;min-height:0}

/* RNG com semente (pros dois celulares gerarem o mesmo jogo) */
function rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rint=(r,n)=>Math.floor(r()*n);
function shuffle(arr,r){ for(let i=arr.length-1;i>0;i--){ const j=rint(r,i+1); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
const newSeed=()=>1+Math.floor(Math.random()*2147483000);

function armPose(mood, sxL, sxR, sy){
  const P={
    idle:  [[sxL-3,sy+24],[sxL-4,sy+46], [sxR+3,sy+24],[sxR+4,sy+46]],
    happy: [[sxL-11,sy-8],[sxL-13,sy-28], [sxR+11,sy-8],[sxR+13,sy-28]],
    wave:  [[sxL-3,sy+24],[sxL-4,sy+46], [sxR+13,sy-6],[sxR+15,sy-26]],
    think: [[sxL-3,sy+24],[sxL-4,sy+46], [sxR+6,sy+22],[56,sy-14]],
    sad:   [[sxL-1,sy+24],[sxL+1,sy+46], [sxR+1,sy+24],[sxR-1,sy+46]],
    reach: [[sxL-3,sy+24],[sxL-4,sy+46], [sxR+12,sy+20],[sxR+24,sy+36]],
    hug:   [[sxL-6,sy+14],[sxL+26,sy+12], [sxR+14,sy+8],[sxR+30,sy+4]],
    kiss:  [[sxL-3,sy+24],[sxL-4,sy+46], [sxR+14,sy+16],[sxR+26,sy+20]],
    dance: [[sxL-12,sy+6],[sxL-18,sy-12], [sxR+12,sy+16],[sxR+20,sy+30]],
    sign:  [[sxL-4,sy+18],[sxL+4,sy+30], [sxR+4,sy+18],[sxR-4,sy+30]],
    give:  [[sxL-3,sy+24],[sxL-4,sy+46], [sxR+12,sy+14],[sxR+22,sy+16]]
  };
  return P[mood]||P.idle;
}

const NET={db:null, on:false, ro:false, docs:{}, subs:{}, w:{}, ready:false};
const hubPath = i => "hub/p"+i;
let myHub={};
function online(){ return NET.on && !NET.ro; }
function partnerHere(){ if(NET.p2p) return online() && NET.p2p.connected() && NET.partnerRole!==S.me; const d=NET.docs[hubPath(other())]; return !!(online() && d && d.act && Date.now()-d.act < 3*60e3); }
function push(path, data){
  if(!online()) return;
  const w=NET.w[path]||(NET.w[path]={busy:false,next:null}); w.next=data;
  if(!w.busy) flush(path);
}
async function flush(path){
  const w=NET.w[path]; if(!w.next){ w.busy=false; return; }
  const d=w.next; w.next=null; w.busy=true;
  try{ await NET.db.doc(path).set(d); }
  catch(e){
    const c=e&&e.code;
    if(c==="invalid_argument"||c==="revoked"||c==="not_granted"||c==="capability_disabled"){ goOffline("Sem permissão pra jogar online por aqui — dá pra jogar no mesmo celular."); }
    else if(c==="unavailable"){ await new Promise(r=>setTimeout(r,600+Math.random()*800)); if(!w.next) w.next=d; }
  }
  w.busy=false; if(w.next) flush(path);
}
function goOffline(msg){ if(NET.ro) return; NET.ro=true; toast(msg,3200); refreshStatus(); }
function pushMe(extra={}){
  myHub=Object.assign({}, myHub, {look:S.players[S.me], act:Date.now()}, extra);
  push(hubPath(S.me), myHub);
}
async function initNet(){
  try{
    let db=null;
    if(window.claude && typeof window.claude.use==="function") db=await window.claude.use("db");
    else if(window.Peer && ROOM.indexOf("__")!==0){
      NET.p2p=makeP2PDB(); NET.p2p.onState=()=>{ refreshStatus(); if(curScreen==="hub") refreshBanners(); if(S.picked && NET.p2p.connected() && NET.partnerRole===S.me && !document.querySelector(".roleFix")) roleConflict(); };
      if(S.picked) NET.p2p.start(S.me); db=NET.p2p.db;
    }
    if(!db) return;
    NET.db=db;
    // testa escrita: se não puder escrever, fica no modo mesmo celular
    const me=S.me; myHub={look:S.players[me], act:Date.now(), x:S.pos[me].x, y:S.pos[me].y, place:"hub"};
    try{ await db.doc(hubPath(me)).set(myHub); }catch(e){ return; }
    NET.on=true;
    const paths=[hubPath(0),hubPath(1),"jogos/bingo","jogos/caca","jogos/termo","jogos/pra-p0","jogos/pra-p1",
      "jogos/bingo-p0","jogos/bingo-p1","jogos/coop","jardim/canteiros","pintura/tela","pintura/p0","pintura/p1","jogos/caca-p0","jogos/caca-p1","jogos/termo-p0","jogos/termo-p1"];
    paths.forEach(p=>{ NET.subs[p]=db.doc(p).onSnapshot(s=>{ NET.docs[p]=s.exists?s.data():null; netChanged(p); }, e=>{}); });
    NET.ready=true; initPetsNet(); refreshStatus();
  }catch(e){}
}
function netChanged(path){
  if(path===hubPath(other())){
    const d=NET.docs[path];
    if(d && d.look && typeof d.look==="object"){ const L=sanitizeLook(d.look); if(JSON.stringify(L)!==JSON.stringify(S.players[other()])){ S.players[other()]=L; save(); if(curScreen==="hub") redrawChars(); } }
  }
  if(screenNet) screenNet(path, NET.docs[path]);
  if(curScreen==="hub") hubNet(path);
}
function sanitizeLook(l){
  const n=(v,max)=>Number.isInteger(v)&&v>=0&&v<max?v:0;
  return {name:String(l.name||"").slice(0,12), skin:n(l.skin,SKINS.length), hair:n(l.hair,HAIRS.length), hairColor:n(l.hairColor,HAIRC.length), shirt:n(l.shirt,SHIRTS.length), build:n(l.build,BUILDS.length), acc:n(l.acc,ACCS.length)};
}

function joinOrCreate(game, extra={}){
  const s=NET.docs["jogos/"+game];
  if(s && s.seed && !s.end && Date.now()-s.start < 12*60e3) return {sess:s, joined:true};
  return {sess:newSession(game, extra), joined:false};

function newSession(game, extra={}){
  const s=Object.assign({seed:newSeed(), start:Date.now()+4000, by:S.me}, extra);
  NET.docs["jogos/"+game]=s; push("jogos/"+game, s); return s;
}

/* =================== CONEXÃO DIRETA ENTRE OS CELULARES (fora do Claude) =================== */
const ROOM = "327aa23377f0";
const VERSION = "2.0";
function makeP2PDB(){
  const KEY_DB = "mundinho-db-"+ROOM;
  let store={}; try{ store=JSON.parse(localStorage.getItem(KEY_DB)||"{}")||{}; }catch(e){ store={}; }
  const docL={}, colL={}; let conns=[], peer=null, role=null, tryT=0, saveT=0, onState=()=>{};
  const persist=()=>{ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(KEY_DB, JSON.stringify(store)); }catch(e){} },300); };
  const clone=o=>o==null?null:JSON.parse(JSON.stringify(o));
  const snap=p=>{ const e=store[p]; const d=e&&e.d; return {id:p.split("/").pop(), exists:!!d, data:()=>d?clone(d):undefined, metadata:{fromCache:false,hasPendingWrites:false}}; };
  const colOf=p=>p.split("/").slice(0,-1).join("/");
  const qsnap=c=>{ const docs=Object.keys(store).filter(k=>colOf(k)===c && store[k].d).sort().map(snap); return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}; };
  const emit=p=>{ (docL[p]||[]).forEach(f=>{ try{f(snap(p));}catch(e){} }); (colL[colOf(p)]||[]).forEach(f=>{ try{f(qsnap(colOf(p)));}catch(e){} }); };
  let seq=0; const stamp=()=>Date.now()*1000+((seq++)%500)*2+(role||0);
  function apply(p,d,ts){ const cur=store[p]; if(cur && cur.ts>=ts) return; store[p]={d,ts}; persist(); emit(p); }
  const send=m=>{ conns.forEach(c=>{ if(c.open){ try{ c.send(m); }catch(e){} } }); };
  function write(p,d){ const ts=stamp(); apply(p,clone(d),ts); send({t:"set",p,d,ts}); mqPub(p,d,ts); }
  // ---------- relay pela internet (MQTT): funciona em qualquer rede, inclusive 4G
  let mq=null, mqOk=false, partnerSeen=0, hiT=0; const MYID=Math.random().toString(36).slice(2,10); const T=`mundinho/${ROOM}`;
  function mqPub(p,d,ts){ if(mq&&mqOk){ try{ mq.publish(`${T}/d/${p}`, JSON.stringify({d,ts}), {qos:1,retain:true}); }catch(e){} } }
  function announce(){ if(mq&&mqOk&&role!=null){ try{ mq.publish(`${T}/hi`, JSON.stringify({role,id:MYID,t:Date.now()}), {qos:0}); }catch(e){} } }
  function announceRe(){ if(mq&&mqOk&&role!=null){ try{ mq.publish(`${T}/hi`, JSON.stringify({role,id:MYID,t:Date.now(),re:1}), {qos:0}); }catch(e){} } }
  function startMQ(){
    if(!window.mqtt || mq) return;
    try{ mq=window.mqtt.connect(window.__MQTT_URL||"wss://broker.emqx.io:8084/mqtt",{clientId:"mdn_"+MYID, keepalive:20, reconnectPeriod:2000, connectTimeout:12000, clean:true}); }catch(e){ mq=null; return; }
    mq.on("connect",()=>{ mqOk=true; mq.subscribe(`${T}/#`,{qos:1}); for(const [pp,e] of Object.entries(store)) if(e&&typeof e.ts==="number") mqPub(pp,e.d,e.ts); announce(); onState(); });
    mq.on("close",()=>{ if(mqOk){ mqOk=false; onState(); } });
    mq.on("error",()=>{});
    mq.on("message",(topic,buf)=>{
      let m; try{ m=JSON.parse(buf.toString()); }catch(e){ return; }
      const sub=topic.slice(T.length+1);
      if(sub.startsWith("d/")){ if(m && typeof m.ts==="number") apply(sub.slice(2), m.d, m.ts); }
      else if(sub==="hi" && m && m.id!==MYID){
        const was=Date.now()-partnerSeen<50000, isNew=m.id!==NET.partnerId; partnerSeen=Date.now(); NET.partnerRole=m.role; NET.partnerId=m.id;
        if(!was||isNew){ if(!m.re) announceRe(); onState(); }
      }
    });
    clearInterval(hiT); hiT=setInterval(()=>{ const was=presence(); announce(); setTimeout(()=>{ if(presence()!==was) onState(); },100); },15000);
  }
  const presence=()=>Date.now()-partnerSeen<50000;
  function onData(m){
    if(!m||typeof m!=="object") return;
    if(m.t==="set" && typeof m.p==="string") apply(m.p, m.d, m.ts);
    if(m.t==="hello"){ NET.partnerRole=m.role; onState(); }
    if(m.t==="sync" && m.s && typeof m.s==="object") for(const [p,e] of Object.entries(m.s)) if(e&&typeof e.ts==="number") apply(p,e.d,e.ts);
  }
  setInterval(()=>{ const now=Date.now(); conns.forEach(c=>{ if(!c.open) return; try{ c.send({t:"ping"}); }catch(e){} if(c._last && now-c._last>16000){ try{c.close();}catch(e){} conns=conns.filter(x=>x!==c); onState(); } }); },5000);
  function setupConn(c){
    c.on("open",()=>{ conns=[...conns.filter(x=>x!==c && x.open), c]; lastOpen=Date.now(); clearTimeout(pendT); c.send({t:"sync", s:store}); c.send({t:"hello",role}); setSt("conectado"); });
    c._last=Date.now(); c.on("data",m=>{ c._last=Date.now(); onData(m); });
    const drop=()=>{ conns=conns.filter(x=>x!==c); lastOpen=Date.now(); if(!connected()) setSt(isHost?"esperando":"procurando"); };
    c.on("close",drop); c.on("error",drop);
  }
  const connected=()=>conns.some(c=>c.open) || presence();
  const HOST=`mundinho-${ROOM}-host`;
  let isHost=false, st="iniciando", pendT=0, lastOpen=0;
  const setSt=s=>{ st=s; onState(); };
  function mkPeer(id){
    try{ return new window.Peer(id, Object.assign({debug:0, config:{iceServers:[
      {urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"},
      {urls:"turn:eu-0.turn.peerjs.com:3478",username:"peerjs",credential:"peerjsp"},
      {urls:"turn:us-0.turn.peerjs.com:3478",username:"peerjs",credential:"peerjsp"}]}}, window.__PEER_OPTS||{})); }catch(e){ setSt("erro"); return null; }
  }
  function killPeer(){ if(peer){ try{ peer.destroy(); }catch(e){} } peer=null; }
  function becomeHost(){
    killPeer(); isHost=true; setSt("conectando");
    const pr=mkPeer(HOST); if(!pr) return; peer=pr;
    pr.on("open",()=>{ if(peer!==pr) return; setSt("esperando"); });
    pr.on("connection",c=>setupConn(c));
    pr.on("disconnected",()=>{ if(peer===pr) try{ pr.reconnect(); }catch(e){} });
    pr.on("error",e=>{ if(peer!==pr) return; if(e&&e.type==="unavailable-id") becomeGuest(); else setSt("erro "+(e&&e.type||"")); });
  }
  function becomeGuest(){
    killPeer(); isHost=false; setSt("conectando");
    const pr=mkPeer(undefined); if(!pr) return; peer=pr;
    pr.on("open",()=>{ if(peer!==pr) return; setSt("procurando"); dial(); });
    pr.on("connection",c=>setupConn(c));
    pr.on("disconnected",()=>{ if(peer===pr) try{ pr.reconnect(); }catch(e){} });
    pr.on("error",e=>{ if(peer!==pr) return; if(e&&e.type==="peer-unavailable") becomeHost(); else setSt("erro "+(e&&e.type||"")); });
  }
  function dial(){
    if(!peer||peer.destroyed||peer.disconnected||connected()||isHost) return;
    try{ const c=peer.connect(HOST,{reliable:true}); setupConn(c); clearTimeout(pendT); pendT=setTimeout(()=>{ if(!c.open && !connected()){ try{c.close();}catch(e){} becomeHost(); } },9000); }catch(e){}
  }
  function tick(){
    if(connected()) return;
    if(!peer||peer.destroyed){ becomeHost(); return; }
    if(isHost){ if(st==="esperando" && Date.now()-lastOpen>25000 && Math.random()<.25){ /* pode ser host "fantasma": tenta como convidado */ becomeGuest(); } }
    else dial();
  }
  function start(r){
    role=r; send({t:"hello",role:r}); startMQ(); announce();
    if(peer) return;
    becomeHost(); clearInterval(tryT); tryT=setInterval(tick,5000);
  }
  function stop(){ clearInterval(tryT); conns.forEach(c=>{ try{c.close();}catch(e){} }); conns=[]; killPeer(); }
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ if(peer&&peer.disconnected){ try{peer.reconnect();}catch(e){} } conns.forEach(c=>{ if(c.open) try{ c.send({t:"sync",s:store}); }catch(e){} }); if(mq&&!mqOk){ try{ mq.reconnect(); }catch(e){} } announce(); tick(); } });
  const db={
    doc:(p)=>({path:p, get:async()=>snap(p), set:async(d)=>write(p,d), update:async(d)=>write(p,Object.assign({},store[p]&&store[p].d,d)),
      delete:async()=>write(p,null), onSnapshot:(next)=>{ (docL[p]=docL[p]||[]).push(next); setTimeout(()=>next(snap(p)),0); return ()=>{ docL[p]=docL[p].filter(f=>f!==next); }; },
      collection:(c)=>db.collection(p+"/"+c)}),
    collection:(c)=>({path:c, doc:(id)=>db.doc(c+"/"+(id||Math.random().toString(36).slice(2))),
      onSnapshot:(next)=>{ (colL[c]=colL[c]||[]).push(next); setTimeout(()=>next(qsnap(c)),0); return ()=>{ colL[c]=colL[c].filter(f=>f!==next); }; }})
  };
  return {db, start, connected, status:()=>st, info:()=>({p2p:st, p2pOpen:conns.some(c=>c.open), host:isHost, relay:mqOk?"ok":(mq?"conectando":"indisponível"), visto:partnerSeen}), set onState(f){ onState=f; }};

function bindKb(root, fn){ root.querySelectorAll(".key").forEach(b=>b.addEventListener("click",()=>fn(b.dataset.k))); keyHandler=fn; }
document.addEventListener("keydown",e=>{
  if(!keyHandler || e.metaKey || e.ctrlKey || e.altKey) return;
  if(document.activeElement && document.activeElement.tagName==="INPUT") return;
  if(e.key==="Enter"){ e.preventDefault(); keyHandler("enter"); }
  else if(e.key==="Backspace"){ e.preventDefault(); keyHandler("back"); }
  else if(e.key==="ArrowLeft") keyHandler("left");
  else if(e.key==="ArrowRight") keyHandler("right");
  else { const k=norm(e.key); if(/^[a-z]$/.test(k)) keyHandler(k); }
});
function makeLine(){
  const L={cells:["","","","",""],pos:0};
  L.key=(k)=>{
    if(k==="back"){ if(L.cells[L.pos]) L.cells[L.pos]=""; else if(L.pos>0){ L.pos--; L.cells[L.pos]=""; } return true; }
    if(k==="left"){ L.pos=Math.max(0,L.pos-1); return true; }
    if(k==="right"){ L.pos=Math.min(4,L.pos+1); return true; }
    if(/^[a-z]$/.test(k)){
      L.cells[L.pos]=k;
      let n=L.cells.findIndex((c,j)=>j>L.pos && !c); if(n===-1) n=L.cells.indexOf("");
      L.pos = n===-1 ? Math.min(4,L.pos+1) : n; return true;
    }
    return false;
  };
  L.word=()=>L.cells.join(""); L.full=()=>L.cells.every(c=>c);
  return L;
}

  s+=`<g id="garden">${gardenSVG(W,H)}</g>`;
  // casinha dos bichinhos
  const dx=X(.2), dy=Y(.615), ds=H/600;
  s+=`<g class="hitg" data-hit="doghouse" transform="translate(${dx} ${dy}) scale(${ds})"><ellipse cx="0" cy="2" rx="34" ry="6" fill="rgba(0,0,0,.15)"/><rect x="-28" y="-40" width="56" height="42" fill="#e8b27a" stroke="#b9824c" stroke-width="2"/><path d="M-36 -38 L0 -66 L36 -38Z" fill="#e2463b" stroke="#b52d26" stroke-width="2"/><path d="M-12 2 L-12 -18 Q0 -32 12 -18 L12 2Z" fill="#5a3a24"/><rect x="-20" y="-60" width="40" height="14" rx="5" fill="#fff" stroke="#e2463b" stroke-width="1.5"/><text x="0" y="-50" text-anchor="middle" font-size="9" font-weight="700" font-family="Fredoka,system-ui" fill="#3a2a33">🐾 PETS</text></g>`;
  s+=`<g id="easel">${easelSVG(W,H)}</g>`;
  // casa
  const hw=.2*W, hh=hw*240/440;
  s+=`<svg class="hitg" data-hit="house" x="${X(.39)-hw/2}" y="${Y(.565)-hh}" width="${hw}" height="${hh}" viewBox="0 0 440 240" overflow="visible">${houseSVG()}</svg>`;
  // lago
  const lx=X(LAKE.x), ly=Y(LAKE.y), lrx=X(LAKE.rx), lry=Y(LAKE.ry);
  s+=`<ellipse cx="${lx}" cy="${ly+4}" rx="${lrx+14}" ry="${lry+10}" fill="#e9d6a8"/><ellipse cx="${lx}" cy="${ly}" rx="${lrx}" ry="${lry}" fill="url(#gLake)"/>`;
  for(let k=0;k<6;k++){ const a=r()*6.28, rr=.3+r()*.5; s+=`<path d="M${lx+Math.cos(a)*lrx*rr-12} ${ly+Math.sin(a)*lry*rr} q12 -4 24 0" stroke="#fff" stroke-width="2" fill="none" opacity=".45"><animate attributeName="opacity" values=".1;.5;.1" dur="${3+r()*3}s" repeatCount="indefinite"/></path>`; }
  [[.72,-.2],[.55,.45],[-.6,.35],[.2,.62]].forEach(([fx,fy])=>{ const px=lx+fx*lrx, py=ly+fy*lry; s+=`<g transform="translate(${px} ${py})"><path d="M0 0 m-9 0 a9 5 0 1 0 18 0 a9 5 0 1 0 -18 0Z" fill="#4f9a41"/><path d="M0 0 L9 -2" stroke="#3f8a35" stroke-width="1.5"/><circle cx="-2" cy="-2" r="2.6" fill="#ff9fc0"/></g>`; });
  const swan=`<g><ellipse cx="0" cy="0" rx="11" ry="5.5" fill="#fff"/><path d="M-11 -1 L-15 -6 L-8 -3Z" fill="#fff"/><path d="M6 -2 Q12 -12 6 -18" stroke="#fff" stroke-width="3.6" fill="none" stroke-linecap="round"/><circle cx="7" cy="-19" r="3.2" fill="#fff"/><path d="M9.6 -19.5 L13.5 -18 L9.6 -17.4Z" fill="#f08a2e"/><circle cx="7.6" cy="-20" r=".8" fill="#222"/><path d="M-8 0 Q0 3 8 0" stroke="#e8eef2" stroke-width="1.5" fill="none"/></g>`;
  const sp=`M${lx-lrx*.5} ${ly+lry*.05} a${lrx*.5} ${lry*.45} 0 1 0 ${lrx} 0 a${lrx*.5} ${lry*.45} 0 1 0 ${-lrx} 0`;
  s+=`<g>${swan}<animateMotion dur="40s" repeatCount="indefinite" path="${sp}" rotate="0"/></g><g>${swan}<animateMotion dur="40s" begin="-3s" repeatCount="indefinite" path="${sp}" rotate="0"/></g>`;
  // píer + barquinho
  const px0=lx-lrx-6, py0=Y(.735);
  s+=`<g>${Array.from({length:8},(_,k)=>`<rect x="${px0+k*9}" y="${py0}" width="8" height="${Y(.03)}" fill="#c8935f" stroke="#a87346"/>`).join("")}<rect x="${px0+2}" y="${py0+Y(.03)}" width="4" height="10" fill="#8a5a3b"/><rect x="${px0+62}" y="${py0+Y(.03)}" width="4" height="10" fill="#8a5a3b"/></g>`;
  s+=`<g id="boat" class="hitg" data-hit="boat"><g id="boatInner" transform="translate(${px0+44} ${Y(.80)})"><ellipse cx="0" cy="8" rx="32" ry="5" fill="rgba(0,60,100,.18)"/><path d="M-30 -6 L30 -6 Q26 8 0 9 Q-26 8 -30 -6Z" fill="#b5653f" stroke="#8a4a2a" stroke-width="1.5"/><path d="M-28 -6 L28 -6" stroke="#e8c39a" stroke-width="3"/><rect x="-4" y="-6" width="8" height="10" fill="#8a4a2a"/><g id="boatHeads"></g><path d="M-36 -2 L-50 -10 M36 -2 L50 -10" stroke="#8a5a3b" stroke-width="2.5" stroke-linecap="round"/></g></g>`;
  // banco
  s+=`<g transform="translate(${X(.705)} ${Y(.585)}) scale(${H/600})"><rect x="-26" y="-14" width="52" height="5" rx="2" fill="#a87346"/><rect x="-26" y="-24" width="52" height="5" rx="2" fill="#a87346"/><rect x="-22" y="-14" width="4" height="16" fill="#6e4528"/><rect x="18" y="-14" width="4" height="16" fill="#6e4528"/></g>`;
  // barraquinhas
  for(const [k,st] of Object.entries(STATIONS)){ const bw=.068*W, bh=bw*112/120; s+=`<svg class="hitg" data-hit="st-${k}" x="${X(st.x)-bw/2}" y="${Y(st.y)-bh}" width="${bw}" height="${bh}" viewBox="0 0 120 112" overflow="visible">${boothSVG(st,k)}</svg>`; }
  // girassóis e florzinhas
  const sunf=(x,y,sc)=>`<g transform="translate(${x} ${y}) scale(${sc})"><path d="M0 0 L0 22" stroke="#4f8f3a" stroke-width="2.2"/><path d="M0 14 Q-7 10 -9 14 Q-5 18 0 16" fill="#5fa046"/>${Array.from({length:10},(_,k)=>`<ellipse cx="0" cy="-6" rx="2.4" ry="5" fill="${k%2?"#ffd23f":"#f7b500"}" transform="rotate(${k*36})"/>`).join("")}<circle r="3.6" fill="#6b3a1d"/></g>`;
  for(let k=0;k<26;k++){ const x=r()*W, y=Y(.93+r()*.06); if(Math.abs(x/W-LAKE.x)<.1) continue; s+=sunf(x,y,(1+r()*.4)*H/600); }
  for(let k=0;k<60;k++){ const x=r()*W, y=Y(.64+r()*.32); if(((x/W-LAKE.x)/(LAKE.rx+.02))**2+((y/H-LAKE.y)/(LAKE.ry+.05))**2<1) continue; const c=["#fff","#ffd6de","#fff3b0","#d9c8ff"][k%4]; s+=`<g transform="translate(${x} ${y})" opacity=".85"><circle r="2" fill="${c}"/><circle cx="3.4" r="2" fill="${c}"/><circle cx="1.7" cy="-2.8" r="2" fill="${c}"/><circle cx="1.7" cy="-1" r="1.1" fill="#f7c63e"/></g>`; }
  return s;
}

/* ---------- jardim ---------- */
function gardenGet(){
  const d = online()? NET.docs["jardim/canteiros"] : S.garden;
  const g = d && Array.isArray(d.plots) ? {plots:d.plots.slice(0,8), buq:Array.isArray(d.buq)?d.buq:[0,0]} : {plots:[], buq:[0,0]};
  while(g.plots.length<8) g.plots.push(null);
  g.plots=g.plots.map(p=> p && FLOWERS[p.f] ? {f:p.f, st:Math.max(0,Math.min(3,p.st|0)), w:+p.w||0, by:p.by===1?1:0} : null);
  return g;
}
function gardenSet(g){ if(online()){ NET.docs["jardim/canteiros"]=g; push("jardim/canteiros", g); } else { S.garden=g; save(); } redrawGarden(); }
function redrawGarden(){ if(!HUB) return; const el=HUB.world.querySelector("#garden"); if(el) el.innerHTML=gardenSVG(HUB.W,HUB.H); }
function redrawEasel(){ if(!HUB) return; const el=HUB.world.querySelector("#easel"); if(el) el.innerHTML=easelSVG(HUB.W,HUB.H); }

/* ---------- mundo ---------- */
function hub(){
  if(NET.pendingUpdate){ setTimeout(()=>{ if(typeof maybeUpdate==="function") maybeUpdate(); },1500); }
  pushMe({place:"hub", x:S.pos[S.me].x, y:S.pos[S.me].y});
  const root=render(`
    <div class="top"><button class="ibtn" id="bMap" aria-label="Lugares">🗺️</button><h1>Nosso Mundinho 💞</h1><button class="ibtn" id="bTrophy" aria-label="Placar">🏆</button></div>
    <div class="statusBar"><div class="pill" id="status"></div></div>
    <div class="scene" id="scene">
      <div class="sunFix"></div>
      <div class="world" id="world"></div>
      <div class="bannerBox" id="banners"></div>
      <button class="edge" id="edge" hidden></button>
      <div class="ctrlChip" id="ctrlBar"></div>
    </div>`, "hub");
  const scene=root.querySelector("#scene"), world=root.querySelector("#world");
  HUB={root, scene, world, W:0, H:0, cam:0, pos:[{...S.pos[0]},{...S.pos[1]}], dest:[null,null], ctrl:S.me, timers:[[],[]], lastEmote:{}, lastCouple:{}, pets:{}, ctx:null, busy:false};
  [0,1].forEach(i=>{ HUB.pos[i]=clampPos(HUB.pos[i].x, HUB.pos[i].y); if(HUB.pos[i].x>1||HUB.pos[i].x<0) HUB.pos[i]={x:.37+i*.04,y:.7}; });
  if(!S.v2pos){ S.v2pos=true; HUB.pos=[{x:.37,y:.71},{x:.41,y:.71}]; S.pos=[{...HUB.pos[0]},{...HUB.pos[1]}]; save(); }
  function build(){
    const H=scene.clientHeight, W=Math.round(H*WR);
    HUB.W=W; HUB.H=H; world.style.width=W+"px";
    world.innerHTML=`<svg class="bg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">${worldSVG(W,H)}</svg>`+
      [0,1].map(i=>`<div class="char" id="ch${i}" data-p="${i}">${av(i,"idle")}<div class="tag" id="tag${i}">${nm(i)}</div></div>`).join("");
    const ch=Math.max(90,Math.min(210,H*.27)); scene.style.setProperty("--ch",ch+"px"); scene.style.setProperty("--ph",Math.round(ch*.36)+"px");
    HUB.ch=ch; HUB.pets={};
    [0,1].forEach(i=>placeChar(i,HUB.pos[i].x,HUB.pos[i].y,0));
    syncPetEls(); camTo(HUB.pos[actor()].x,0);
  }
  build();
  const pd=NET.docs[hubPath(other())]; if(online() && pd && typeof pd.x==="number" && pd.x<=1){ HUB.pos[other()]=clampPos(pd.x,pd.y); placeChar(other(),HUB.pos[other()].x,HUB.pos[other()].y,0); HUB.lastEmote[other()]=pd.emote&&pd.emote.t; HUB.lastCouple[other()]=pd.couple&&pd.couple.t; }
  let rsT=0; const onResize=()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ if(Math.abs(scene.clientHeight-HUB.H)>40) build(); },300); };
  window.addEventListener("resize",onResize);
  HUB.statusInt=setInterval(()=>{ refreshStatus(); edgeCheck(); },5000);
  HUB.petInt=setInterval(()=>{ syncPetEls(); const ids=Object.keys(HUB.pets||{}); if(ids.length&&Math.random()<.35){ const id=pick(ids), p=getPet(id); if(p) petSay(id, petPhrase(p)); } },9000);
  screenCleanup=()=>{ window.removeEventListener("resize",onResize); clearInterval(HUB.statusInt); clearInterval(HUB.petInt); Object.values(HUB.pets||{}).forEach(o=>clearTimeout(o.tm)); [0,1].forEach(i=>HUB.timers[i].forEach(clearTimeout)); };
  refreshCtrl(); refreshStatus(); refreshBanners(); refreshTags();
  root.querySelector("#bMap").onclick=placesModal;
  root.querySelector("#bTrophy").onclick=trophyModal;
  root.querySelector("#status").onclick=()=>{ const i=NET.p2p?NET.p2p.info():{}; modal(`<h2>Conexão</h2><p>Versão <b>${VERSION}</b> · você é <b>${nm(S.me)}</b></p>
    <p>Direta: <b>${esc(i.p2p||"-")}</b>${i.p2pOpen?" ✅":""}<br>Pela internet: <b>${esc(i.relay||"-")}</b><br>${nm(other())} visto: <b>${i.visto?ago(i.visto):"ainda não"}</b></p>
    <div class="stack"><button class="btn alt" id="bWho">👤 Trocar de personagem</button><button class="btn" data-close>OK</button></div>`).querySelector("#bWho").onclick=whoModal; };
  root.querySelector("#edge").onclick=()=>{ const p=HUB.pos[other()]; walkTo(actor(), p.x+(HUB.pos[actor()].x<p.x?-.02:.02), p.y); };
  // toque: andar / abrir menu; arrastar: olhar em volta
  let down=null;
  scene.addEventListener("pointerdown",e=>{ if(e.target.closest(".ctx,.bannerBox,.edge,.ctrlChip")) return; down={x:e.clientX,y:e.clientY,cam:HUB.cam,moved:false,t:e.target}; });
  scene.addEventListener("pointermove",e=>{ if(!down) return; const dx=e.clientX-down.x; if(Math.abs(dx)>12) down.moved=true; if(down.moved){ closeCtx(); setCam(down.cam-dx,0); HUB.lookUntil=Date.now()+4000; } });
  scene.addEventListener("pointerup",e=>{ const d=down; down=null; if(!d||d.moved) return; tapAt(e, d.t); });
  scene.addEventListener("pointercancel",()=>{ down=null; });
  setTimeout(()=>{ if(!S.tutV2){ S.tutV2=true; save(); say(actor(),"Toca no chão pra andar e nas coisas pra interagir ✨",4200); } else say(actor(), partnerHere()?`Oi, ${nmRaw(other())}! 👋`:"Oi! 😊",2200); },600);
}
function tapAt(e, target){
  if(target.closest(".ctx")) return;
  if(HUB.ctx){ closeCtx(); return; }
  const ch=target.closest(".char"); if(ch) return charMenu(+ch.dataset.p);
  const pe=target.closest(".pet"); if(pe) return petMenu(pe.dataset.pet);
  const hit=target.closest("[data-hit]"); if(hit) return hitMenu(hit.dataset.hit);
  const r=HUB.world.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
  marker(x,y); walkTo(actor(), x, y);
}
function clampPos(x,y){
  x=Math.max(.008,Math.min(.992,x)); y=Math.max(.6,Math.min(.965,y));
  const ex=(x-LAKE.x)/(LAKE.rx+.012), ey=(y-LAKE.y)/(LAKE.ry+.045), d=Math.hypot(ex,ey);
  if(d<1){ const k=1/(d||1); x=LAKE.x+ex*k*(LAKE.rx+.012); y=LAKE.y+ey*k*(LAKE.ry+.045); if(y<.6||y>.965){ y=Math.max(.6,Math.min(.965,y)); } }
  return {x,y};
}
function crossesLake(a,b){ for(let k=1;k<20;k++){ const x=a.x+(b.x-a.x)*k/20, y=a.y+(b.y-a.y)*k/20; if(((x-LAKE.x)/LAKE.rx)**2+((y-LAKE.y)/LAKE.ry)**2<1) return true; } return false; }
function charEl(i){ return HUB && HUB.world.querySelector("#ch"+i); }
function placeChar(i,x,y,dur){
  const el=charEl(i); if(!el) return;
  const sc=.8+.35*((y-.6)/.365);
  el.style.transition = dur? `left ${dur}ms linear, top ${dur}ms linear, transform ${dur}ms linear` : "none";
  el.style.left=(x*100)+"%"; el.style.top=(y*100)+"%"; el.style.zIndex=Math.round(y*1000);
  el.style.transform=`translate(-50%,-100%) scale(${sc.toFixed(3)})`;
}
function setCam(c,dur){ if(!HUB) return; const VW=HUB.scene.clientWidth; c=Math.max(0,Math.min(HUB.W-VW,c)); HUB.cam=c; HUB.world.style.transition=dur?`transform ${dur}ms linear`:"none"; HUB.world.style.transform=`translateX(${-c}px)`; edgeCheck(); }
function camTo(x,dur){ if(!HUB) return; if(HUB.lookUntil && Date.now()<HUB.lookUntil && dur===0) return; setCam(x*HUB.W-HUB.scene.clientWidth/2, dur); }
function walkTo(i, x, y, onArrive, fromNet){
  if(!HUB) return;
  const p=clampPos(x,y), el=charEl(i); if(!el) return;
  HUB.timers[i].forEach(clearTimeout); HUB.timers[i]=[];
  el.classList.remove("leanR","leanL","hugging","dancing");
  const pts=[]; let cur={...HUB.pos[i]};
  if(crossesLake(cur,p)){ const via={x:LAKE.x, y:(cur.y+p.y)/2<LAKE.y? .6 : .955}; pts.push(via); }
  pts.push(p);
  HUB.dest[i]=p; hideEnter();
  if(!fromNet){ if(!online()||i===S.me){ S.pos[i]=p; save(); } if(online() && i===S.me) pushMe({x:p.x,y:p.y,place:"hub"}); }
  let t=0; const speed=HUB.H*.62;
  pts.forEach((q,k)=>{
    const from=k?pts[k-1]:cur, dist=Math.hypot((q.x-from.x)*HUB.W,(q.y-from.y)*HUB.H), dur=Math.max(150,dist/speed*1000);
    HUB.timers[i].push(setTimeout(()=>{
      if(Math.abs(q.x-from.x)>.002) el.classList.toggle("left", q.x<from.x);
      el.classList.add("walking"); placeChar(i,q.x,q.y,dur); HUB.pos[i]={...q};
      if(i===actor()) camTo(q.x,dur);
    },t));
    t+=dur;
  });
  HUB.timers[i].push(setTimeout(()=>{ el.classList.remove("walking"); if(onArrive) onArrive(); else if(!fromNet && i===actor()) checkNear(i); },t+30));
}
function faceTo(i, dir){ const el=charEl(i); if(el) el.classList.toggle("left", dir==="left"); }
function marker(x,y){ const p=clampPos(x,y); const m=document.createElement("div"); m.className="marker"; m.style.left=(p.x*100)+"%"; m.style.top=(p.y*100)+"%"; HUB.world.appendChild(m); setTimeout(()=>m.remove(),700); }
function checkNear(i){ const p=HUB.pos[i]; for(const [k,s] of Object.entries(STATIONS)){ if(Math.abs(p.x-s.x)<.03 && p.y<s.y+.12) { showEnter(k); return; } } }
function showEnter(g){ hideEnter(); const s=STATIONS[g]; const b=document.createElement("button"); b.className="enterBtn"; b.textContent=`${s.emoji} Jogar ${GAME_NAMES[g]}`; b.style.left=(s.x*100)+"%"; b.style.top=((s.y+.01)*100)+"%"; b.onclick=()=>openStation(g); HUB.world.appendChild(b); HUB.enterBtn=b; }
function hideEnter(){ if(HUB&&HUB.enterBtn){ HUB.enterBtn.remove(); HUB.enterBtn=null; } }
function edgeCheck(){
  if(!HUB) return; const b=HUB.root.querySelector("#edge"); if(!b) return;
  const px=HUB.pos[other()].x*HUB.W - HUB.cam, VW=HUB.scene.clientWidth;
  if(px<-10){ b.hidden=false; b.textContent=`◀ ${nmRaw(other())}`; b.style.left="8px"; b.style.right="auto"; }
  else if(px>VW+10){ b.hidden=false; b.textContent=`${nmRaw(other())} ▶`; b.style.right="8px"; b.style.left="auto"; }
  else b.hidden=true;
}
function placesModal(){
  const m=modal(`<h2>🗺️ Ir para…</h2><div class="stack">${PLACES.map(([e,n],k)=>`<button class="btn ${["pink","gold","blue","","alt"][k]}" data-k="${k}">${e} ${n}</button>`).join("")}
    <button class="btn alt" data-k="p">💞 Até ${nm(other())}</button></div>`);
  m.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ m.remove(); const k=b.dataset.k; if(k==="p"){ const p=HUB.pos[other()]; walkTo(actor(),p.x-.02,p.y); } else { const [,,x,y]=PLACES[+k]; walkTo(actor(),x,y); } });

function hitMenu(h){

function coupleAct(a, ini, fromNet, at){
  if(!HUB) return; const o=1-ini;
  if(a==="boat") return boatRide(ini, fromNet);
  const tp=HUB.pos[o], ip=HUB.pos[ini];
  const side = ip.x<=tp.x ? -1 : 1;
  const d={kiss:.36,hug:.27,dance:.5,flowers:.42}[a]*HUB.ch/HUB.W;
  let tx=tp.x+side*d, ty=tp.y;
  if(at){ tx=at.x; ty=at.y; }
  if(!fromNet && online() && ini===S.me) pushMe({couple:{a,t:Date.now(),x:tx,y:ty}});
  walkTo(ini, tx, ty, ()=>{
    const L = tx<tp.x ? ini : o, R = 1-L;
    faceTo(L,"right"); faceTo(R,"left");
    const eL=charEl(L), eR=charEl(R);
    const mid=()=>({x:(HUB.pos[0].x+HUB.pos[1].x)/2*HUB.W, y:Math.min(HUB.pos[0].y,HUB.pos[1].y)*HUB.H-HUB.ch*.95});
    if(a==="kiss"){
      setMood(L,"kiss"); setMood(R,"kiss"); eL.classList.add("leanR"); eR.classList.add("leanL");
      setTimeout(()=>{ const m=mid(); bigPop("💋", m.x, m.y+HUB.ch*.12); hearts(HUB.world, m.x-10, m.y+20, ["💖","💕","❤️","💗"], 9); },450);
      later(ini,()=>{ eL.classList.remove("leanR"); eR.classList.remove("leanL"); setMood(L,"happy"); setMood(R,"happy"); },2600);
      later(ini,()=>{ setMood(L,"idle"); setMood(R,"idle"); },3800);
    }
    if(a==="hug"){
      setMood(L,"hug"); setMood(R,"hug"); eL.classList.add("leanR","hugging"); eR.classList.add("leanL","hugging");
      setTimeout(()=>{ const m=mid(); bigPop("🤗", m.x, m.y); hearts(HUB.world, m.x-10, m.y+30, ["💞","💕","🥰"], 8); },350);
      later(ini,()=>{ eL.classList.remove("leanR","hugging"); eR.classList.remove("leanL","hugging"); setMood(L,"happy"); setMood(R,"happy"); },2800);
      later(ini,()=>{ setMood(L,"idle"); setMood(R,"idle"); },3900);
    }
    if(a==="dance"){
      setMood(L,"dance"); setMood(R,"dance"); eL.classList.add("dancing"); eR.classList.add("dancing");
      let n=0; const iv=setInterval(()=>{ notes(L); notes(R); if(++n>3) clearInterval(iv); },900); HUB.timers[ini].push(iv);
      later(ini,()=>{ eL.classList.remove("dancing"); eR.classList.remove("dancing"); setMood(L,"happy"); setMood(R,"happy"); },4200);
      later(ini,()=>{ setMood(L,"idle"); setMood(R,"idle"); },5200);
    }
    if(a==="flowers"){
      setMood(ini,"give",{hold:"💐"}); say(ini,`Pra você, ${nmRaw(o)}! 💐`,2600);
      setTimeout(()=>{ setMood(o,"happy",{hold:"💐"}); say(o,pick(["Que lindas!! 🥹","Ownnn 💕","Amei! 💐"]),2400); floatAt(o,["💐","🌸","💕"],7); },1100);
      if(!fromNet){ const g=gardenGet(); g.buq[ini]=Math.max(0,(g.buq[ini]||0)-1); gardenSet(g); }
      later(ini,()=>{ setMood(ini,"idle"); setMood(o,"idle"); },4200);
    }
  }, fromNet);
}
function bigPop(t,x,y){ const e=document.createElement("div"); e.className="bigPop"; e.textContent=t; e.style.left=x+"px"; e.style.top=y+"px"; HUB.world.appendChild(e); setTimeout(()=>e.remove(),1600); }
function boatRide(ini, fromNet){
  if(HUB.boating) return; const o=1-ini;
  if(!fromNet && online() && ini===S.me) pushMe({couple:{a:"boat",t:Date.now()}});
  const dock={x:LAKE.x-LAKE.rx-.004,y:.71};
  let arrived=0; const go=()=>{ if(++arrived<2) return; startRide(); };
  walkTo(ini, dock.x-.012, dock.y, go, fromNet);
  walkTo(o, dock.x+.004, dock.y+.004, go, true);
  function startRide(){
    HUB.boating=true;
    const c0=charEl(0), c1=charEl(1); [c0,c1].forEach(c=>c&&(c.style.opacity="0"));
    const inner=HUB.world.querySelector("#boatInner"), heads=HUB.world.querySelector("#boatHeads"); if(!inner) return end();
    heads.innerHTML=`<svg x="-26" y="-50" width="26" height="52" viewBox="0 -6 100 200" overflow="visible">${avatarSVG(S.players[0],"happy")}</svg><svg x="0" y="-50" width="26" height="52" viewBox="0 -6 100 200" overflow="visible">${avatarSVG(S.players[1],"happy")}</svg>`;
    const base=inner.getAttribute("transform"), W=HUB.W, H=HUB.H, lx=LAKE.x*W, ly=LAKE.y*H, rx=LAKE.rx*W*.55, ry=LAKE.ry*H*.5;
    const t0=performance.now(), DUR=9000; camTo(LAKE.x,600);
    say(ini,"Bora remar! 🛶",2000);
    const step=now=>{
      const k=Math.min(1,(now-t0)/DUR); const ang=Math.PI+k*Math.PI*2;
      const x=lx+Math.cos(ang)*rx, y=ly+Math.sin(ang)*ry*.8;
      inner.setAttribute("transform",`translate(${x} ${y})`);
      if(Math.random()<.04) hearts(HUB.world, x-10, y-50, ["💕","💗","✨"], 1);
      if(k<1 && HUB && HUB.boating) requestAnimationFrame(step); else end();
    };
    requestAnimationFrame(step);
    function end(){ if(!HUB) return; HUB.boating=false; inner.setAttribute("transform",base); heads.innerHTML=""; [c0,c1].forEach(c=>c&&(c.style.opacity="1")); floatAt(ini,["💞","💕"],6); say(o,"Que passeio lindo 🥰",2400); }
  }
}

function evaluate(g, a){
  const res=Array(5).fill("absent"), left={};
  for(let i=0;i<5;i++){ if(g[i]===a[i]) res[i]="correct"; else left[a[i]]=(left[a[i]]||0)+1; }
  for(let i=0;i<5;i++){ if(res[i]!=="correct" && left[g[i]]>0){ res[i]="present"; left[g[i]]--; } }
  return res;
}
const EMO={correct:"🟩",present:"🟨",absent:"⬛"};
const WIN_MSG=["Lendário! 🤯","Impressionante! ✨","Arrasou! 💪","Mandou bem! 😎","Boa! 👏","Ufa! No limite! 😮‍💨"];

/* duel: {seed} → os dois jogam a mesma palavra ao vivo */
function play({player, answer, chooser, onDone, onQuit, duel}){
  const L=makeLine(); const rows=[]; let busy=false, done=false; const kstate={};
  const left = 0, right = 1;
  const root=render(`
    ${topbar(duel?"Duelo de Termo ⚔️":`${nm(player)} adivinha`, false)}
    <div class="stage">
      ${slot(0)}
      <div class="turn">${duel?`<span id="pstat">${nm(chooser)}</span><div class="mini" id="mini"></div>`:`vez de<b>${nm(player)}</b>`}</div>
      ${slot(1)}
    </div>
    <div class="boardWrap"><div class="board" id="board"></div></div>
    ${kbHTML()}`,"play");
  function slot(i){
    const cls=(i===0?"left":"right")+(i===player?" active":"");
    if(i===player) return av(i,"think",{cls});
    return duel? av(i,"think",{cls}) : av(i,"sign",{sign:"?????",cls});
  }
  const board=root.querySelector("#board");
  bindTop(root, ()=>{
    if(done) return (onQuit||hub)();
    confirmBox("Sair da partida?","O progresso dessa palavra vai ser perdido.","Sair",()=>(onQuit||hub)());
  });
  function drawBoard(){
    let h="";
    for(let r=0;r<6;r++){
      if(r<rows.length){ const {g,res}=rows[r]; const d=[...disp(g)];
        h+=`<div class="brow">${res.map((s,i)=>`<div class="tile ${s}">${d[i]}</div>`).join("")}</div>`; }
      else if(r===rows.length && !done) h+=lineHTML(L,false);
      else h+=`<div class="brow future">${"<div class='tile'></div>".repeat(5)}</div>`;
    }
    board.innerHTML=h;
    const cur=board.querySelector(".brow.current");
    if(cur) cur.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{ if(busy) return; L.pos=+t.dataset.i; drawBoard(); });
  }
  function paintKeys(){ root.querySelectorAll(".key").forEach(b=>{ const s=kstate[b.dataset.k]; b.classList.remove("correct","present","absent"); if(s) b.classList.add(s); }); }
  drawBoard();
  // duelo: progresso do outro
  let partner=null;
  function drawPartner(){
    if(!duel) return;
    const mini=root.querySelector("#mini"), st=root.querySelector("#pstat"); if(!mini) return;
    const pr = partner && partner.seed===duel.seed ? partner : null;
    const prow = pr ? (pr.rows||[]) : [];
    let h=""; for(let r=0;r<6;r++){ const s=prow[r]||""; for(let c=0;c<5;c++) h+=`<i class="${s[c]||""}"></i>`; }
    mini.innerHTML=h;
    st.innerHTML = !pr ? `${nm(chooser)} <small>(esperando…)</small>` : pr.done ? `${nm(chooser)}: <b style="display:inline">${pr.solved?pr.tries+"/6":"X/6"}</b>` : `${nm(chooser)} <small>jogando…</small>`;
    const line=document.getElementById("partnerLine"); if(line) line.innerHTML=duelLine();
  }
  function duelLine(){
    const pr = partner && partner.seed===duel.seed ? partner : null;
    if(!pr || !pr.done) return `Esperando ${nm(chooser)} terminar… ⏳`;
    const me={solved:rows.length&&rows[rows.length-1].res.every(s=>s==="correct"), tries:rows.length, t:myDoneT};
    const a=me.solved?me.tries:7, b=pr.solved?pr.tries:7;
    let w = a<b?player: b<a?chooser : (a===7? -1 : (me.t<=pr.t?player:chooser));
    if(!duelCounted){ duelCounted=true; addWin("termo",w); if(w===player){ setMood(chooser,"sad"); } else if(w===chooser){ setMood(chooser,"happy",{crown:true}); } }
    return w===-1? `${nm(chooser)} também não acertou. Empate! 🤝` : w===player? `Você venceu ${nm(chooser)} (${b===7?"X":b}/6)! 🏆` : `${nm(chooser)} venceu com ${b}/6 😤`;
  }
  let duelCounted=false, myDoneT=0;
  if(duel){
    partner=NET.docs["jogos/termo-p"+chooser]; drawPartner();
    screenNet=(path,d)=>{ if(path==="jogos/termo-p"+chooser){ const was=partner; partner=d; drawPartner();
      if(d && d.seed===duel.seed && !done){ const n=(d.rows||[]).length, pn=was&&was.seed===duel.seed?(was.rows||[]).length:0;
        if(d.done && !(was&&was.done&&was.seed===duel.seed)) say(chooser, d.solved?`Acertei em ${d.tries}! 😎`:"Não acertei 😭",3000);
        else if(n>pn){ const g=(d.rows[n-1].match(/c/g)||[]).length; say(chooser, g>=3?"Tô quase! 🔥":g===0?"Errei feio 😅":"Hmm... 🤔",1800); } } } };
    pushDuel();
  } else setTimeout(()=>say(chooser, pick(["Duvido acertar 😏","Boa sorte, amor 😘","Essa é difícil hein 🤭","Pensa bem 🤔"])),400);
  function pushDuel(){ if(!duel) return; push("jogos/termo-p"+player,{seed:duel.seed, rows:rows.map(r=>r.res.map(s=>s[0]).join("")), done, solved: done&&rows.length&&rows[rows.length-1].res.every(s=>s==="correct"), tries:rows.length, t:myDoneT||Date.now()}); }

  function submit(){
    if(busy||done) return;
    const cur=board.querySelector(".brow.current");
    if(!L.full()){ toast("Só palavras com 5 letras"); shake(cur); return; }
    const g=L.word();
    if(!VSET.has(g)){ toast("Essa palavra não é aceita"); shake(cur); say(player,"Ops 😅",1200); return; }
    busy=true;
    const res=evaluate(g,answer); const d=[...disp(g)];
    const tiles=cur.querySelectorAll(".tile");
    tiles.forEach((t,i)=>{ t.classList.remove("cursor");
      setTimeout(()=>{ t.classList.add("flip"); setTimeout(()=>{ cur.classList.remove("current"); t.style.border="0"; t.textContent=d[i]; t.classList.add(res[i]); },250); }, i*260); });
    setTimeout(()=>{
      rows.push({g,res});
      const RK={absent:1,present:2,correct:3}; res.forEach((s,i)=>{ const k=g[i], p=kstate[k]; if(!p||RK[s]>RK[p]) kstate[k]=s; });
      paintKeys();
      const greens=res.filter(s=>s==="correct").length, hits=res.filter(s=>s!=="absent").length;
      const won=greens===5, lost=!won && rows.length===6;
      if(won||lost){ done=true; myDoneT=Date.now(); busy=false; drawBoard(); pushDuel(); finish(won); return; }
      L.cells=["","","","",""]; L.pos=0; drawBoard(); busy=false; pushDuel();
      if(greens>=3){ setMood(player,"happy"); if(!duel) say(chooser,pick(["Tá quase! 🔥","Quente, quente! 🥵","Eita, chegando perto 😳"])); }
      else if(hits===0){ setMood(player,"sad"); if(!duel) say(chooser,pick(["Errou feio, errou rude 😂","Frio, gelado ❄️","Hahaha nada 🙃"])); }
      else if(!duel) say(chooser,pick(["Hmm... 🤔","Vai, você consegue!","Esquentando 👀","Nem perto... ou será? 😏"]));
      setTimeout(()=>{ if(!done) setMood(player,"think"); },1300);
    }, 5*260+300);
  }
  function finish(won){
    const tries=rows.length;
    const grid=rows.map(r=>r.res.map(s=>EMO[s]).join("")).join("\n");
    if(won){
      board.querySelectorAll(".brow")[tries-1].querySelectorAll(".tile").forEach((t,i)=>{ t.style.animationDelay=(i*90)+"ms"; t.classList.remove("flip"); t.classList.add("win"); });
      setMood(player,"happy");
      if(!duel){ setMood(chooser,"sign",{sign:disp(answer),revealed:true}); say(chooser, pick(["Aaah, acertou! 😤","Como assim?! 😱","Orgulho de você 🥹","Sorte de principiante 🙄"]),4000); }
    } else {
      setMood(player,"sad");
      if(!duel){ setMood(chooser,"sign",{sign:disp(answer),revealed:true}); say(chooser, pick(["Hehe, não foi dessa vez 😈","Ganhei essa! 😎","Era fácil, amor 🤭"]),4000); }
    }
    keyHandler=null;
    setTimeout(()=>{
      const card=document.createElement("div"); card.className="endCard";
      card.innerHTML=`<h2>${won?WIN_MSG[tries-1]:"Não foi dessa vez 😢"}</h2>
        <p>${won?`${nm(player)} acertou em ${tries}/6`:`A palavra era:`}</p>
        <div class="word">${[...disp(answer)].map(c=>`<span>${c}</span>`).join("")}</div>
        ${duel?`<p id="partnerLine" style="font-weight:600;color:#3a2a33">${duelLine()}</p>`:""}
        <button class="btn" id="cont">${duel?"Voltar pro parque 🏞️":"Continuar →"}</button>`;
      root.appendChild(card);
      card.querySelector("#cont").onclick=()=>onDone({solved:won,tries:won?tries:7,grid,answer});
    }, won?900:600);
  }
  bindKb(root,k=>{ if(done||busy) return; if(k==="enter") return submit(); if(L.key(k)) drawBoard(); });
}

/* código (WhatsApp) */
const M=26**5, A=1103515, B=7340033;
function inv(a,m){ let [o,r]=[a%m,m],[x,y]=[1,0]; while(r){ const q=Math.floor(o/r); [o,r]=[r,o-q*r]; [x,y]=[y,x-q*y]; } return ((x%m)+m)%m; }
const AINV=inv(A,M);
const SORTED=[...VALID].sort();
const IDX=new Map(SORTED.map((w,i)=>[w,i]));
function encode(word, sender){ const n=IDX.get(word)*2+sender; let x=(n*A+B)%M; let s=""; for(let i=0;i<5;i++){ s=String.fromCharCode(65+x%26)+s; x=Math.floor(x/26); } return s; }
function decode(code){
  if(!/^[A-Za-z]{5}$/.test(code||"")) return null;
  let x=0; for(const c of code.toUpperCase()) x=x*26+(c.charCodeAt(0)-65);
  const d=((x-B)%M+M)%M; const n=Number((BigInt(d)*BigInt(AINV))%BigInt(M));
  const idx=Math.floor(n/2), sender=n%2; if(idx>=SORTED.length) return null; return {word:SORTED[idx], sender};
}
function decodeWord(code){ const d=decode(code); return d?d.word:null; }

  };
  root.querySelector("#ok").onclick=go;
  bindKb(root,k=>{ if(k==="enter") return go(); if(L.key(k)) draw(); });
}

/* =================== TERMO JUNTOS (cooperativo) =================== */
function termoCoop(isOnline){
  let sess, joined=false;
  if(isOnline){ ({sess,joined}=joinOrCreate("coop",{rows:[]})); pushMe({place:"coop"}); }
  else sess={seed:newSeed(), start:Date.now(), by:S.me, rows:[]};
  if(!Array.isArray(sess.rows)) sess.rows=[];
  const answer=ANSWERS[(sess.seed*7+3) % ANSWERS.length];
  const me=S.me, o=other();
  const L=makeLine(); let busy=false, over=false, partnerTyping="", typT=0, counted=false;
  const turnOf=()=> isOnline ? (sess.rows.length%2===0 ? sess.by : 1-sess.by) : (sess.rows.length%2===0 ? sess.by : 1-sess.by);
  const myTurn=()=> !isOnline || turnOf()===me;
  const root=render(`
    ${topbar("Termo juntos 🤝", false)}
    <div class="stage">
      ${av(0,"think",{cls:"left"})}
      <div class="turn" id="turnTxt"></div>
      ${av(1,"think",{cls:"right"})}
    </div>
    <div class="boardWrap"><div class="board" id="board"></div></div>
    ${kbHTML()}`,"coop");
  const board=root.querySelector("#board");
  bindTop(root, ()=>{ if(over) return hub(); confirmBox("Sair do Termo juntos?", isOnline?"A partida continua salva, dá pra voltar depois.":"O progresso vai ser perdido.","Sair",hub); });
  const rowsEval=()=>sess.rows.map(r=>({g:r.g, by:r.by, res:evaluate(r.g,answer)}));
  function draw(){
    const rows=rowsEval();
    let h="";
    for(let r=0;r<6;r++){
      if(r<rows.length){ const {g,res,by}=rows[r]; const d=[...disp(g)];
        h+=`<div class="brow" style="position:relative">${res.map((s,i)=>`<div class="tile ${s}">${d[i]}</div>`).join("")}<div style="position:absolute;left:calc(-1 * var(--tile) * .62);top:50%;transform:translateY(-50%);width:calc(var(--tile)*.52)">${head(by)}</div></div>`; }
      else if(r===rows.length && !over){
        if(myTurn()) h+=lineHTML(L,false);
        else h+=`<div class="brow current" style="opacity:.75">${[0,1,2,3,4].map(i=>`<div class="tile">${partnerTyping[i]||""}</div>`).join("")}</div>`;
      } else h+=`<div class="brow future">${"<div class='tile'></div>".repeat(5)}</div>`;
    }
    board.innerHTML=h;
    const cur=board.querySelector(".brow.current");
    if(cur && myTurn()) cur.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{ if(busy) return; L.pos=+t.dataset.i; draw(); });
    // teclado
    const ks={}, RK={absent:1,present:2,correct:3};
    rows.forEach(({g,res})=>res.forEach((s,i)=>{ const k=g[i]; if(!ks[k]||RK[s]>RK[ks[k]]) ks[k]=s; }));
    root.querySelectorAll(".key").forEach(b=>{ b.classList.remove("correct","present","absent"); if(ks[b.dataset.k]) b.classList.add(ks[b.dataset.k]); });
    root.querySelector(".kb").style.opacity = myTurn()||over ? "1" : ".45";
    const tt=root.querySelector("#turnTxt");
    tt.innerHTML = over ? "" : isOnline ? (myTurn()? `sua vez<b>${nm(me)} ✍️</b>` : `vez de<b>${nm(turnOf())}</b>`) : `vez de<b>${nm(turnOf())}</b>`;
    [0,1].forEach(i=>root.querySelectorAll(`.avatar[data-p="${i}"]`).forEach(a=>a.classList.toggle("active", !over && i===turnOf())));
  }
  draw();
  function pushTyping(){ if(!isOnline) return; clearTimeout(typT); typT=setTimeout(()=>pushMe({typing:{s:sess.seed,n:sess.rows.length,c:L.cells.join("")}}),60); }
  function checkEnd(){
    const rows=rowsEval(); const last=rows[rows.length-1];
    const won = last && last.res.every(s=>s==="correct"), lost=!won && rows.length>=6;
    if(!(won||lost) || over) return;
    over=true; keyHandler=null; draw();
    if(!counted){ counted=true; S.coop=S.coop||{p:0,w:0}; S.coop.p++; if(won) S.coop.w++; save(); }
    if(won){ board.querySelectorAll(".brow")[rows.length-1].querySelectorAll(".tile").forEach((t,i)=>{ t.style.animationDelay=(i*90)+"ms"; t.classList.add("win"); });
      setMood(0,"happy"); setMood(1,"happy"); say(last.by, pick(["Acertamos!! 💞","Time perfeito! 🥰","Somos demais! ✨"]),4000);
    } else { setMood(0,"sad"); setMood(1,"sad"); }
    if(isOnline && sess.by===me && !sess.end) push("jogos/coop", Object.assign({}, sess, {end:Date.now()}));
    setTimeout(()=>{
      const card=document.createElement("div"); card.className="endCard";
      card.innerHTML=`<h2>${won?`Acertamos juntos em ${rows.length}/6! 💞`:"Não foi dessa vez 😢"}</h2>
        <p>${won?"":"A palavra era:"}</p>
        <div class="word">${[...disp(answer)].map(c=>`<span>${c}</span>`).join("")}</div>
        <p>Termo juntos: <b>${S.coop.w}</b> acertos em ${S.coop.p} partidas</p>
        <div class="row2"><button class="btn alt" id="bk">Parque</button><button class="btn pink" id="again">Jogar de novo</button></div>`;
      root.appendChild(card);
      card.querySelector("#bk").onclick=hub;
      card.querySelector("#again").onclick=()=>{ if(isOnline) newSession("coop",{rows:[]}); termoCoop(isOnline); };
    }, won?900:600);
  }
  function submit(){
    if(busy||over||!myTurn()) return;
    const cur=board.querySelector(".brow.current");
    if(!L.full()){ toast("Só palavras com 5 letras"); shake(cur); return; }
    const g=L.word(); if(!VSET.has(g)){ toast("Essa palavra não é aceita"); shake(cur); return; }
    const by = isOnline? me : turnOf();
    sess=Object.assign({}, sess, {rows:[...sess.rows, {g,by}]});
    if(isOnline){ NET.docs["jogos/coop"]=sess; push("jogos/coop", sess); }
    L.cells=["","","","",""]; L.pos=0; partnerTyping="";
    busy=true; draw();
    const rowEl=board.querySelectorAll(".brow")[sess.rows.length-1];
    rowEl.querySelectorAll(".tile").forEach((t,i)=>{ t.style.animationDelay=(i*160)+"ms"; t.classList.add("flip"); });
    setTimeout(()=>{ busy=false; draw(); const res=evaluate(g,answer), gr=res.filter(s=>s==="correct").length;
      if(gr<5) say(by, gr>=3?"Tá quase! 🔥": gr===0?"Ops, nada 😅":"Hmm... 🤔",1600);
      if(!isOnline && gr<5) setTimeout(()=>say(turnOf(),"Minha vez! ✍️",1400),500);
      checkEnd(); pushTyping(); }, 5*160+400);
  }
  bindKb(root,k=>{ if(over||busy) return; if(!myTurn()){ toast(`Espera a vez de ${nmRaw(turnOf())} 😉`,1200); return; } if(k==="enter") return submit(); if(L.key(k)){ draw(); pushTyping(); } });
  if(isOnline){
    screenNet=(path,d)=>{
      if(path==="jogos/coop" && d && d.seed===sess.seed){
        const n=(d.rows||[]).length, was=sess.rows.length; sess=d; if(!Array.isArray(sess.rows)) sess.rows=[];
        if(n>was){ partnerTyping=""; draw(); const rowEl=board.querySelectorAll(".brow")[n-1]; if(rowEl) rowEl.querySelectorAll(".tile").forEach((t,i)=>{ t.style.animationDelay=(i*160)+"ms"; t.classList.add("flip"); });
          const last=sess.rows[n-1]; const gr=evaluate(last.g,answer).filter(s=>s==="correct").length;
          if(last.by!==me && gr<5) say(last.by, gr>=3?"Tá quase! 🔥":"Sua vez, amor 😘",1800);
          setTimeout(checkEnd, 5*160+400); }
        else draw();
      } else if(path==="jogos/coop" && d && d.seed!==sess.seed && d.by===o && !over && Date.now()-d.start<60e3){ toast(`${nmRaw(o)} começou uma partida nova`); termoCoop(true); }
      if(path===hubPath(o) && d && d.typing && d.typing.s===sess.seed && d.typing.n===sess.rows.length && !myTurn()){ partnerTyping=d.typing.c||""; draw(); }
    };
    if(!joined) setTimeout(()=>toast(`Convite enviado! ${nmRaw(o)} vê no parque 💌`,2400),300);
    else say(o,"Bora descobrir juntos! 💞",2000);
    checkEnd();
  } else setTimeout(()=>say(turnOf(),"Eu começo! ✍️",1500),400);
}

/* =================== BINGO =================== */
const BCOL=["#4a9bff","#ff7a93","#3aa394","#d9a54a","#8a63d2"];
const BINT=4500;
function bingoCard(seed,p){
  const r=rng(seed*31+p*7+11), cols=[];
  for(let c=0;c<5;c++) cols.push(shuffle(Array.from({length:15},(_,k)=>c*15+k+1),r).slice(0,5).sort((a,b)=>a-b));
  const cells=[]; for(let row=0;row<5;row++) for(let c=0;c<5;c++) cells.push(row===2&&c===2?0:cols[c][row]);
  return cells;
}
function drawOrder(seed){ return shuffle(Array.from({length:75},(_,k)=>k+1), rng((seed^0x5bd1e995)>>>0)); }
const BLINES=(()=>{ const L=[]; for(let i=0;i<5;i++){ L.push([0,1,2,3,4].map(c=>i*5+c)); L.push([0,1,2,3,4].map(r=>r*5+i)); } L.push([0,6,12,18,24]); L.push([4,8,12,16,20]); return L; })();
function bingoLine(card, marks, drawnSet){ return BLINES.find(l=>l.every(i=>i===12 || (marks.has(i) && drawnSet.has(card[i])))); }
const bLetter=n=>"BINGO"[Math.floor((n-1)/15)];
function bingoGame(isOnline){
  let sess, joined=false;
  if(isOnline){ ({sess,joined}=joinOrCreate("bingo")); pushMe({place:"bingo"}); }
  else sess={seed:newSeed(), start:Date.now()+3500};
  const me=S.me, o=other();
  const order=drawOrder(sess.seed), cards=[bingoCard(sess.seed,0),bingoCard(sess.seed,1)];
  const marks=[new Set(),new Set()]; let over=false, lastCount=-1, partnerDoc=null, myClaim=null;
  const players = isOnline? [me] : [0,1];
  const W=Math.min(app.clientWidth,520);
  const big = isOnline ? Math.floor(Math.min((W-60)/5, 62)) : Math.floor(Math.min((W-62)/10, 40));
  const cardHTML=(p,size,mini)=>`

      <div class="bgrid">${"BINGO".split("").map((l,c)=>`<div class="h" style="background:${BCOL[c]}">${l}</div>`).join("")}
        ${cards[p].map((n,i)=>`<div class="bcell ${n===0?"free mk":""}" data-i="${i}" ${n===0?`style="background:${BCOL[2]}"`:""}>${n===0?"⭐":n}</div>`).join("")}</div>
      ${mini?"":`<button class="bingoBtn" data-b="${p}">BINGO!</button>`}
    </div>`;
  const root=render(`
    ${topbar(isOnline?"Bingo online 🎱":"Bingo 🎱", false)}
    <div class="caller">
      ${av(0,"idle",{cls:"left"}).replace('class="avatar','style="height:110px" class="avatar')}
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div class="ballBig" id="ball"><div class="in" id="ballIn"></div></div>
        <div class="callerInfo" id="info"></div>
      </div>
      ${av(1,"idle",{cls:"right"}).replace('class="avatar','style="height:110px" class="avatar')}
    </div>
    <div class="cardsArea">
      <div class="hist" id="hist" style="max-width:none;justify-content:center"></div>
      ${isOnline? `${cardHTML(me,big,false)}
        <div class="bcard" style="--bc-s:13px;padding:6px 8px" data-card="${o}"><div class="hd" style="margin-bottom:4px"><span class="nm" style="font-size:.85rem">${head(o)}${nm(o)}</span><span id="pst" style="font-size:.75rem;color:#8b7682"></span></div>
          <div class="bgrid" style="gap:2px">${cards[o].map((n,i)=>`<div class="bcell ${n===0?"mk":""}" data-i="${i}" style="border-radius:3px;font-size:0;${n===0?`background:${BCOL[2]}`:""}"></div>`).join("")}</div></div>`
      : `<div class="bcards">${cardHTML(0,big,false)}${cardHTML(1,big,false)}</div>`}
    </div>`,"bingo");
  bindTop(root, ()=>{ if(over) return hub(); confirmBox("Sair do bingo?","A partida continua sem você.","Sair",hub); }, showHelp);
  const ball=root.querySelector("#ball"), ballIn=root.querySelector("#ballIn"), info=root.querySelector("#info"), hist=root.querySelector("#hist");
  const count=()=>Math.max(0,Math.min(75,Math.floor((Date.now()-sess.start)/BINT)+1));
  const drawnSet=()=>new Set(order.slice(0,count()));
  function tick(){
    if(over) return;
    const now=Date.now();
    if(now<sess.start){ ballIn.innerHTML=`<b>${Math.ceil((sess.start-now)/1000)}</b>`; ball.style.setProperty("--bc","#a28d98"); info.textContent= isOnline&&!joined?`Esperando ${nmRaw(o)} entrar…`:"Começando…"; return; }
    const c=count();

      updCounts();
      if(c===75 && now-sess.start > 75*BINT+6000) endGame(-1);

  }

    const ds=drawnSet();
    players.forEach(p=>{ const near=Math.min(...BLINES.map(l=>l.filter(i=>i!==12 && !(marks[p].has(i)&&ds.has(cards[p][i]))).length)); const el=root.querySelector("#cnt"+p); if(el) el.textContent= near===0?"BINGO! 🔥": near===1?"falta 1! 😱":`falta ${near}`; });

  root.querySelectorAll(".bcard").forEach(cd=>{

      if(marks[p].has(i)){ marks[p].delete(i); cell.classList.remove("mk"); cell.style.background=""; }
      else { marks[p].add(i); cell.classList.add("mk"); cell.style.background=BCOL[i%5]; }
      updCounts(); if(isOnline) pushProg();
    });
  });
  root.querySelectorAll(".bingoBtn").forEach(b=>b.onclick=()=>{
    if(over) return; const p=+b.dataset.b; const ln=bingoLine(cards[p], marks[p], drawnSet());
    if(!ln){ toast("Ainda não fechou uma linha! 😅",1400); say(p,"Ops, falso bingo 🙈",1500); return; }
    if(isOnline){ myClaim=Date.now(); pushProg(); const pc=partnerClaim(); if(pc && pc<myClaim) return endGame(o); }
    endGame(p, ln);
